<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natak Mesh - Meshtastic Radio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .bridge-toggle { display: flex; align-items: center; gap: 15px; margin: 15px 0; }
        .toggle-switch { position: relative; width: 60px; height: 32px; cursor: pointer; }
        .toggle-switch input { opacity: 0; width: 0; height: 0; }
        .toggle-slider { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: #444; border-radius: 32px; transition: 0.3s; }
        .toggle-slider:before { content: ""; position: absolute; height: 24px; width: 24px; left: 4px; bottom: 4px; background: #ccc; border-radius: 50%; transition: 0.3s; }
        .toggle-switch input:checked + .toggle-slider { background: #00ff88; }
        .toggle-switch input:checked + .toggle-slider:before { transform: translateX(28px); background: #fff; }
        .toggle-switch input:disabled + .toggle-slider { opacity: 0.5; cursor: not-allowed; }
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; }
        .status-dot.active { background: #00ff88; }
        .status-dot.inactive { background: #666; }
        .status-dot.error { background: #ff4444; }
        .mode-label { font-size: 18px; font-weight: bold; }
    </style>
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='images/NatakMeshsecondary-overlay.png') }}" alt="Natak Mesh" class="logo">
        <nav>
            <button class="nav-btn" onclick="window.location.href='/'">← Back to Menu</button>
        </nav>
    </header>

    <main>
        <div style="max-width: 700px; margin: 0 auto;">
            <h1>Meshtastic Radio</h1>

            <!-- Radio Detection -->
            <div style="background: #2d2d2d; padding: 20px; border-radius: 8px; margin: 20px 0;">
                <h2>Radio</h2>
                <div style="color: #a0a0a0; margin-top: 10px;">
                    <span class="status-dot" id="radio-dot"></span>
                    <span id="radio-status">Checking...</span>
                </div>
            </div>

            <!-- Bridge Mode Control -->
            <div style="background: #2d2d2d; padding: 20px; border-radius: 8px; margin: 20px 0;">
                <h2>ATAK CoT Bridge</h2>
                <p style="color: #a0a0a0; margin: 5px 0 15px 0;">
                    Bridges ATAK position and chat data to/from Meshtastic LoRa.
                    When off, the radio stays in BLE mode for the phone app.
                </p>

                <div class="bridge-toggle">
                    <label class="toggle-switch">
                        <input type="checkbox" id="bridge-toggle" onchange="toggleBridge(this.checked)">
                        <span class="toggle-slider"></span>
                    </label>
                    <span id="mode-label" class="mode-label" style="color: #a0a0a0;">—</span>
                </div>

                <!-- Service Status -->
                <div id="service-status" style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #444; color: #a0a0a0;">
                    <div><span class="status-dot" id="service-dot"></span> Service: <span id="service-state">—</span></div>
                </div>
            </div>

            <!-- Feedback Message -->
            <div id="message" style="margin-top: 20px; padding: 15px; border-radius: 4px; display: none; background: #2d2d2d;"></div>
        </div>
    </main>

    <script>
        let refreshInterval;

        window.addEventListener('DOMContentLoaded', function() {
            loadStatus();
            refreshInterval = setInterval(loadStatus, 5000);
        });

        function loadStatus() {
            fetch('/api/meshtastic/status')
                .then(r => r.json())
                .then(data => {
                    // Radio detection
                    const radioDot = document.getElementById('radio-dot');
                    const radioStatus = document.getElementById('radio-status');
                    if (data.radio_detected) {
                        radioDot.className = 'status-dot active';
                        radioStatus.textContent = 'Detected (USB serial)';
                        radioStatus.style.color = '#00ff88';
                    } else {
                        radioDot.className = 'status-dot error';
                        radioStatus.textContent = 'Not detected';
                        radioStatus.style.color = '#ff4444';
                    }

                    // Bridge toggle
                    const toggle = document.getElementById('bridge-toggle');
                    const modeLabel = document.getElementById('mode-label');
                    toggle.checked = data.bridge_enabled;
                    if (data.bridge_enabled) {
                        modeLabel.textContent = 'Bridge Mode';
                        modeLabel.style.color = '#00ff88';
                    } else {
                        modeLabel.textContent = 'BLE Mode';
                        modeLabel.style.color = '#a0a0a0';
                    }

                    // Service status
                    const serviceDot = document.getElementById('service-dot');
                    const serviceState = document.getElementById('service-state');
                    if (data.service_active) {
                        serviceDot.className = 'status-dot active';
                        serviceState.textContent = 'Running';
                        serviceState.style.color = '#00ff88';
                    } else if (data.bridge_enabled) {
                        serviceDot.className = 'status-dot error';
                        serviceState.textContent = 'Enabled but not running';
                        serviceState.style.color = '#ff4444';
                    } else {
                        serviceDot.className = 'status-dot inactive';
                        serviceState.textContent = 'Stopped';
                        serviceState.style.color = '#666';
                    }
                })
                .catch(err => {
                    console.error('Error loading status:', err);
                });
        }

        function toggleBridge(enabled) {
            const toggle = document.getElementById('bridge-toggle');
            toggle.disabled = true;

            const url = enabled
                ? '/api/meshtastic/bridge/enable'
                : '/api/meshtastic/bridge/disable';

            fetch(url, { method: 'POST' })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        showMessage(data.message, 'success');
                    } else {
                        showMessage('Error: ' + (data.error || 'Unknown error'), 'error');
                        // Revert toggle on failure
                        toggle.checked = !enabled;
                    }
                    toggle.disabled = false;
                    loadStatus();
                })
                .catch(err => {
                    showMessage('Error: ' + err.message, 'error');
                    toggle.checked = !enabled;
                    toggle.disabled = false;
                });
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.display = 'block';
            if (type === 'success') {
                msg.style.background = '#2d4d2d';
                msg.style.color = '#00ff88';
                msg.style.border = '1px solid #00ff88';
            } else {
                msg.style.background = '#4d2d2d';
                msg.style.color = '#ff4444';
                msg.style.border = '1px solid #ff4444';
            }
            setTimeout(function() { msg.style.display = 'none'; }, 5000);
        }
    </script>
</body>
</html>
