<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natak Mesh - Meshtastic Radio</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .msg-sent { color: #4a9eff; }
        .msg-received { color: #00ff88; }
        .msg-time { color: #666; font-size: 12px; }
        .msg-who { color: #a0a0a0; font-size: 13px; }
        .message-item { padding: 8px 0; border-bottom: 1px solid #333; }
        .message-log { max-height: 400px; overflow-y: auto; }
        #send-form { display: flex; gap: 10px; margin-top: 10px; }
        #send-form input[type="text"] { flex: 1; padding: 12px; font-size: 16px; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 4px; }
        #send-form button { padding: 12px 24px; background: #4a9eff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; }
        #send-form button:disabled { background: #333; cursor: not-allowed; }
    </style>
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='images/NatakMeshsecondary-overlay.png') }}" alt="Natak Mesh" class="logo">
        <nav>
            <button class="nav-btn" onclick="window.location.href='/'">← Back to Menu</button>
        </nav>
    </header>

    <main>
        <div style="max-width: 700px; margin: 0 auto;">
            <h1>Meshtastic Radio</h1>

            <!-- Status Display -->
            <div style="background: #2d2d2d; padding: 20px; border-radius: 8px; margin: 20px 0;">
                <h2>Status: <span id="status" style="color: #ff4444;">Disconnected</span></h2>
                <div id="node-details" style="margin-top: 10px; color: #a0a0a0; display: none;">
                    <div><strong>Node Name:</strong> <span id="node-name">N/A</span></div>
                    <div><strong>Short Name:</strong> <span id="short-name">N/A</span></div>
                    <div><strong>Port:</strong> <span id="port">N/A</span></div>
                    <div><strong>Known Nodes:</strong> <span id="known-nodes">0</span></div>
                </div>
            </div>

            <!-- Connect/Disconnect Control -->
            <div style="background: #2d2d2d; padding: 20px; border-radius: 8px; margin: 20px 0;">
                <h3>Serial Control</h3>
                <p style="color: #a0a0a0; margin: 5px 0 15px 0;">Take control of the radio via serial or release back to Bluetooth/phone app.</p>
                <div>
                    <button id="btn-connect" onclick="doConnect()" style="padding: 15px 30px; margin-right: 10px; background: #00ff88; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;">Take Control</button>
                    <button id="btn-disconnect" onclick="doDisconnect()" style="padding: 15px 30px; background: #ff4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;" disabled>Release to BLE</button>
                </div>
            </div>

            <!-- Send Message -->
            <div id="send-section" style="background: #2d2d2d; padding: 20px; border-radius: 8px; margin: 20px 0; display: none;">
                <h3>Send Message</h3>
                <form id="send-form" onsubmit="doSend(event)">
                    <input type="text" id="msg-input" placeholder="Type a message..." autocomplete="off">
                    <button type="submit" id="btn-send">Send</button>
                </form>
            </div>

            <!-- Message Log -->
            <div style="background: #2d2d2d; padding: 20px; border-radius: 8px; margin: 20px 0;">
                <h3>Messages <span id="msg-count" style="color: #666; font-size: 14px;"></span></h3>
                <div id="message-log" class="message-log">
                    <div style="color: #666; padding: 20px; text-align: center;">No messages yet.</div>
                </div>
            </div>

            <!-- Feedback Message -->
            <div id="message" style="margin-top: 20px; padding: 15px; border-radius: 4px; display: none; background: #2d2d2d;"></div>
        </div>
    </main>

    <script>
        let refreshInterval;

        window.addEventListener('DOMContentLoaded', function() {
            loadStatus();
            loadMessages();
            refreshInterval = setInterval(function() {
                loadStatus();
                loadMessages();
            }, 3000);
        });

        function loadStatus() {
            fetch('/api/meshtastic/status')
                .then(r => r.json())
                .then(data => {
                    const statusEl = document.getElementById('status');
                    const detailsEl = document.getElementById('node-details');
                    const sendSection = document.getElementById('send-section');
                    const btnConnect = document.getElementById('btn-connect');
                    const btnDisconnect = document.getElementById('btn-disconnect');

                    if (data.state === 'CONNECTED') {
                        statusEl.textContent = 'Connected';
                        statusEl.style.color = '#00ff88';
                        detailsEl.style.display = 'block';
                        sendSection.style.display = 'block';
                        btnConnect.disabled = true;
                        btnConnect.textContent = 'Connected';
                        btnDisconnect.disabled = false;

                        if (data.node_info) {
                            document.getElementById('node-name').textContent = data.node_info.long_name || 'N/A';
                            document.getElementById('short-name').textContent = data.node_info.short_name || 'N/A';
                            document.getElementById('port').textContent = data.node_info.port || 'N/A';
                        }
                        document.getElementById('known-nodes').textContent = data.known_nodes || '0';
                    } else if (data.state === 'CONNECTING') {
                        statusEl.textContent = 'Connecting...';
                        statusEl.style.color = '#ff8800';
                        btnConnect.disabled = true;
                        btnConnect.textContent = 'Connecting...';
                        btnDisconnect.disabled = true;
                    } else {
                        statusEl.textContent = 'Disconnected';
                        statusEl.style.color = '#ff4444';
                        detailsEl.style.display = 'none';
                        sendSection.style.display = 'none';
                        btnConnect.disabled = false;
                        btnConnect.textContent = 'Take Control';
                        btnDisconnect.disabled = true;
                    }
                })
                .catch(err => {
                    console.error('Error loading status:', err);
                });
        }

        function loadMessages() {
            fetch('/api/meshtastic/messages')
                .then(r => r.json())
                .then(data => {
                    const log = document.getElementById('message-log');
                    const countEl = document.getElementById('msg-count');
                    countEl.textContent = '(' + data.count + ')';

                    if (!data.messages || data.messages.length === 0) {
                        log.innerHTML = '<div style="color: #666; padding: 20px; text-align: center;">No messages yet.</div>';
                        return;
                    }

                    let html = '';
                    // Show newest first
                    const msgs = data.messages.slice().reverse();
                    msgs.forEach(function(msg) {
                        const isSent = msg.direction === 'sent';
                        const arrow = isSent ? '→' : '←';
                        const cssClass = isSent ? 'msg-sent' : 'msg-received';
                        const who = isSent ? (msg.to || '^all') : (msg.from || 'unknown');
                        const ts = msg.timestamp ? msg.timestamp.split('T')[1].split('.')[0] : '';

                        html += '<div class="message-item">';
                        html += '<span class="msg-time">' + ts + '</span> ';
                        html += '<span class="' + cssClass + '">' + arrow + '</span> ';
                        html += '<span class="msg-who">[' + who + ']</span> ';
                        html += '<span>' + escapeHtml(msg.text || '') + '</span>';
                        html += '</div>';
                    });

                    log.innerHTML = html;
                })
                .catch(err => {
                    console.error('Error loading messages:', err);
                });
        }

        function doConnect() {
            const btn = document.getElementById('btn-connect');
            btn.disabled = true;
            btn.textContent = 'Connecting...';

            fetch('/api/meshtastic/connect', {method: 'POST'})
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        showMessage('Radio connected via serial', 'success');
                    } else {
                        showMessage('Error: ' + (data.error || 'Connection failed'), 'error');
                        btn.disabled = false;
                        btn.textContent = 'Take Control';
                    }
                    loadStatus();
                })
                .catch(err => {
                    showMessage('Error: ' + err.message, 'error');
                    btn.disabled = false;
                    btn.textContent = 'Take Control';
                });
        }

        function doDisconnect() {
            const btn = document.getElementById('btn-disconnect');
            btn.disabled = true;
            btn.textContent = 'Releasing...';

            fetch('/api/meshtastic/disconnect', {method: 'POST'})
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        showMessage('Radio released. Rebooting to restore BLE...', 'success');
                    } else {
                        showMessage('Error: ' + (data.error || 'Disconnect failed'), 'error');
                    }
                    setTimeout(loadStatus, 2000);
                    btn.textContent = 'Release to BLE';
                })
                .catch(err => {
                    showMessage('Error: ' + err.message, 'error');
                    btn.disabled = false;
                    btn.textContent = 'Release to BLE';
                });
        }

        function doSend(e) {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text) return;

            const btn = document.getElementById('btn-send');
            btn.disabled = true;

            fetch('/api/meshtastic/send', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({text: text})
            })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        input.value = '';
                        loadMessages();
                    } else {
                        showMessage('Send failed: ' + (data.error || 'Unknown error'), 'error');
                    }
                    btn.disabled = false;
                })
                .catch(err => {
                    showMessage('Error: ' + err.message, 'error');
                    btn.disabled = false;
                });
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.display = 'block';
            if (type === 'success') {
                msg.style.background = '#2d4d2d';
                msg.style.color = '#00ff88';
                msg.style.border = '1px solid #00ff88';
            } else {
                msg.style.background = '#4d2d2d';
                msg.style.color = '#ff4444';
                msg.style.border = '1px solid #ff4444';
            }
            setTimeout(function() { msg.style.display = 'none'; }, 5000);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
