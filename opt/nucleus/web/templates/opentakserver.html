<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natak Mesh - OpenTAKServer</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='images/NatakMeshsecondary-overlay.png') }}" alt="Natak Mesh" class="logo">
        <nav>
            <button class="nav-btn" onclick="window.location.href='/'">← Back to Menu</button>
        </nav>
    </header>

    <main>
        <div class="dashboard">
            <h1>OpenTAKServer</h1>

            <div id="status-container" class="node-grid">
                <div class="loading">Loading OpenTAKServer status...</div>
            </div>

            <div id="actions-section" style="display: none; margin-top: 24px; text-align: center;">
                <a id="ots-link" href="#" target="_blank" class="nav-btn" style="display: inline-block; text-decoration: none; font-size: 1.1rem; padding: 12px 32px; background-color: #1A09f1;">
                    Open OTS Admin Panel ↗
                </a>
                <br><br>
                <button id="refresh-btn" class="nav-btn" onclick="refreshStatus()">Refresh Status</button>
                <button id="restart-btn" class="nav-btn" onclick="restartOTS()" style="background-color: var(--color-warning);">Restart OTS</button>
            </div>

            <div id="video-section" style="display: none; margin-top: 24px;">
                <div class="node-card">
                    <div class="node-header">
                        <span class="node-ip">Video Streams</span>
                    </div>
                    <div class="node-body" id="video-list">
                        <div style="color: var(--text-secondary); font-size: 14px;">No active streams</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script>
        async function refreshStatus() {
            try {
                const r = await fetch('/api/opentakserver/status');
                const data = await r.json();
                renderStatus(data);
            } catch (err) {
                console.error('Error:', err);
                document.getElementById('status-container').innerHTML =
                    '<div class="error">Error loading OpenTAKServer status</div>';
            }
        }

        function renderStatus(data) {
            const c = document.getElementById('status-container');
            const running = data.service_running;
            const clients = data.clients || 0;
            const streams = data.video_streams || [];

            const svcColor = running ? 'var(--color-connected)' : 'var(--color-disconnected)';
            const svcText = running ? 'RUNNING' : 'STOPPED';
            const svcClass = running ? 'connected' : 'disconnected';

            const clientColor = clients > 0 ? 'var(--color-connected)' : 'var(--text-secondary)';

            c.innerHTML = `
                <div class="node-card ${svcClass}">
                    <div class="node-header">
                        <span class="node-ip">Service Status</span>
                    </div>
                    <div class="node-body" style="text-align: center;">
                        <div style="font-size: 48px; font-weight: bold; color: ${svcColor}; margin: 16px 0;">
                            ${running ? '●' : '○'}
                        </div>
                        <div style="font-size: 24px; font-weight: bold; margin-bottom: 8px;">
                            ${svcText}
                        </div>
                    </div>
                    <div class="node-status-label ${svcClass}">${svcText}</div>
                </div>

                <div class="node-card ${clients > 0 ? 'connected' : ''}">
                    <div class="node-header">
                        <span class="node-ip">Connected EUDs</span>
                    </div>
                    <div class="node-body" style="text-align: center;">
                        <div style="font-size: 48px; font-weight: bold; color: ${clientColor}; margin: 16px 0;">
                            ${clients}
                        </div>
                        <div style="font-size: 18px; font-weight: bold; margin-bottom: 8px;">
                            TAK Client${clients !== 1 ? 's' : ''}
                        </div>
                    </div>
                </div>
            `;

            // Show actions
            document.getElementById('actions-section').style.display = 'block';

            // Video streams
            const vs = document.getElementById('video-section');
            const vl = document.getElementById('video-list');
            if (streams.length > 0) {
                vs.style.display = 'block';
                vl.innerHTML = streams.map(s =>
                    `<div class="node-metric">
                        <span class="label">${s.name}</span>
                        <span class="value" style="color: var(--color-connected);">● Live</span>
                    </div>`
                ).join('');
            } else {
                vs.style.display = 'block';
                vl.innerHTML = '<div style="color: var(--text-secondary); font-size: 14px;">No active video streams</div>';
            }
        }

        async function restartOTS() {
            if (!confirm('Restart OpenTAKServer? Connected clients will be briefly disconnected.')) return;

            const btn = document.getElementById('restart-btn');
            btn.disabled = true;
            btn.textContent = 'Restarting...';

            try {
                const r = await fetch('/api/opentakserver/restart', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' }
                });
                const result = await r.json();
                if (result.success) {
                    alert('OpenTAKServer restarted successfully');
                    setTimeout(refreshStatus, 5000);
                } else {
                    alert('Error: ' + (result.error || 'Unknown error'));
                }
            } catch (err) {
                alert('Error: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Restart OTS';
            }
        }

        // Set OTS admin link to port 8080 on the same host the user is accessing
        document.getElementById('ots-link').href = 'http://' + window.location.hostname + ':8080';

        refreshStatus();
    </script>
</body>
</html>
