<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natak Mesh - Remote Access</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='images/NatakMeshsecondary-overlay.png') }}" alt="Natak Mesh" class="logo">
        <nav>
            <button class="nav-btn" onclick="window.location.href='/'">Network Monitor</button>
            <button class="nav-btn" onclick="window.location.href='/config'">Configuration</button>
            <button class="nav-btn" onclick="window.location.href='/scan'">Wi-Fi Scan</button>
        </nav>
    </header>

    <main>
        <div style="max-width: 600px; margin: 0 auto;">
            <h1>Remote Access (Tailscale)</h1>
            
            <!-- Status Display -->
            <div style="background: #2d2d2d; padding: 20px; border-radius: 8px; margin: 20px 0;">
                <h2>Status: <span id="status" style="color: #00ff88;">Loading...</span></h2>
                <div style="margin-top: 10px; color: #a0a0a0;">
                    <div><strong>Tailscale IP:</strong> <span id="tailscale-ip">N/A</span></div>
                    <div><strong>Tailnet:</strong> <span id="tailnet">N/A</span></div>
                    <div><strong>Hostname:</strong> <span id="hostname">N/A</span></div>
                </div>
            </div>
            
            <!-- Control Buttons -->
            <div style="background: #2d2d2d; padding: 20px; border-radius: 8px; margin: 20px 0;">
                <h3>Connection Control</h3>
                <div style="margin-top: 20px;">
                    <button id="btn-up" onclick="turnUp()" style="padding: 15px 30px; margin-right: 10px; background: #00ff88; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;">Turn On</button>
                    <button id="btn-down" onclick="turnDown()" style="padding: 15px 30px; background: #ff4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;">Turn Off</button>
                </div>
            </div>
            
            <!-- Profile Switching -->
            <div style="background: #2d2d2d; padding: 20px; border-radius: 8px; margin: 20px 0;">
                <h3>Switch Tailnet</h3>
                <div style="margin-top: 15px;">
                    <select id="profile-select" style="width: 100%; padding: 10px; font-size: 16px; background: #1a1a1a; color: #fff; border: 1px solid #444; border-radius: 4px; margin-bottom: 15px;">
                        <option value="">Loading profiles...</option>
                    </select>
                    <button id="btn-switch" onclick="switchProfile()" style="padding: 12px 30px; background: #4a9eff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold; width: 100%;">Switch</button>
                </div>
            </div>
            
            <!-- Message Display -->
            <div id="message" style="margin-top: 20px; padding: 15px; border-radius: 4px; display: none; background: #2d2d2d;"></div>
            
            <p style="color: #a0a0a0; margin-top: 20px;">Tailscale provides secure remote access to your Nucleus device. Connect this node to the internet and turn on Tailscale to access it from anywhere.</p>
        </div>
    </main>

    <script>
        let statusRefreshInterval;
        let selectedProfileId = null;

        // Load status and profiles on page load
        window.addEventListener('DOMContentLoaded', function() {
            loadStatus();
            loadProfiles();
            // Auto-refresh status every 10 seconds
            statusRefreshInterval = setInterval(loadStatus, 10000);
        });

        function loadStatus() {
            fetch('/api/tailscale/status')
                .then(r => r.json())
                .then(data => {
                    const statusEl = document.getElementById('status');
                    const ipEl = document.getElementById('tailscale-ip');
                    const tailnetEl = document.getElementById('tailnet');
                    const hostnameEl = document.getElementById('hostname');
                    
                    if (data.connected) {
                        statusEl.textContent = 'Connected';
                        statusEl.style.color = '#00ff88';
                        ipEl.textContent = data.ip || 'N/A';
                        tailnetEl.textContent = data.tailnet || 'N/A';
                        hostnameEl.textContent = data.hostname || 'N/A';
                    } else {
                        statusEl.textContent = 'Disconnected';
                        statusEl.style.color = '#ff4444';
                        ipEl.textContent = 'N/A';
                        tailnetEl.textContent = 'N/A';
                        hostnameEl.textContent = data.hostname || 'N/A';
                    }
                })
                .catch(err => {
                    console.error('Error loading status:', err);
                    document.getElementById('status').textContent = 'Error';
                    document.getElementById('status').style.color = '#ff8800';
                });
        }

        function loadProfiles() {
            fetch('/api/tailscale/profiles')
                .then(r => r.json())
                .then(data => {
                    const select = document.getElementById('profile-select');
                    select.innerHTML = '';
                    
                    if (data.profiles && data.profiles.length > 0) {
                        data.profiles.forEach(profile => {
                            const option = document.createElement('option');
                            option.value = profile.id;
                            option.textContent = profile.tailnet + (profile.current ? ' (current)' : '');
                            if (profile.current) {
                                option.selected = true;
                                selectedProfileId = profile.id;
                            }
                            select.appendChild(option);
                        });
                        
                        // Update selected profile when dropdown changes
                        select.addEventListener('change', function() {
                            selectedProfileId = this.value;
                        });
                    } else {
                        const option = document.createElement('option');
                        option.value = '';
                        option.textContent = 'No profiles available';
                        select.appendChild(option);
                        document.getElementById('btn-switch').disabled = true;
                    }
                })
                .catch(err => {
                    console.error('Error loading profiles:', err);
                    const select = document.getElementById('profile-select');
                    select.innerHTML = '<option value="">Error loading profiles</option>';
                });
        }

        function turnUp() {
            const btn = document.getElementById('btn-up');
            btn.disabled = true;
            btn.textContent = 'Connecting...';
            
            fetch('/api/tailscale/up', {method: 'POST'})
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        showMessage('Tailscale connected successfully', 'success');
                    } else {
                        showMessage('Error: ' + (data.error || 'Failed to connect'), 'error');
                    }
                    setTimeout(() => {
                        loadStatus();
                        btn.disabled = false;
                        btn.textContent = 'Turn On';
                    }, 2000);
                })
                .catch(err => {
                    showMessage('Error: ' + err.message, 'error');
                    btn.disabled = false;
                    btn.textContent = 'Turn On';
                });
        }

        function turnDown() {
            const btn = document.getElementById('btn-down');
            btn.disabled = true;
            btn.textContent = 'Disconnecting...';
            
            fetch('/api/tailscale/down', {method: 'POST'})
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        showMessage('Tailscale disconnected successfully', 'success');
                    } else {
                        showMessage('Error: ' + (data.error || 'Failed to disconnect'), 'error');
                    }
                    setTimeout(() => {
                        loadStatus();
                        btn.disabled = false;
                        btn.textContent = 'Turn Off';
                    }, 2000);
                })
                .catch(err => {
                    showMessage('Error: ' + err.message, 'error');
                    btn.disabled = false;
                    btn.textContent = 'Turn Off';
                });
        }

        function switchProfile() {
            if (!selectedProfileId) {
                showMessage('Please select a profile', 'error');
                return;
            }
            
            const btn = document.getElementById('btn-switch');
            btn.disabled = true;
            btn.textContent = 'Switching...';
            
            fetch('/api/tailscale/switch', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({profile_id: selectedProfileId})
            })
                .then(r => r.json())
                .then(data => {
                    if (data.success) {
                        showMessage('Successfully switched to selected profile', 'success');
                        setTimeout(() => {
                            loadStatus();
                            loadProfiles();
                        }, 2000);
                    } else {
                        showMessage('Error: ' + (data.error || 'Failed to switch profile'), 'error');
                    }
                    btn.disabled = false;
                    btn.textContent = 'Switch';
                })
                .catch(err => {
                    showMessage('Error: ' + err.message, 'error');
                    btn.disabled = false;
                    btn.textContent = 'Switch';
                });
        }

        function showMessage(text, type) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.display = 'block';
            
            if (type === 'success') {
                msg.style.background = '#2d4d2d';
                msg.style.color = '#00ff88';
                msg.style.border = '1px solid #00ff88';
            } else if (type === 'error') {
                msg.style.background = '#4d2d2d';
                msg.style.color = '#ff4444';
                msg.style.border = '1px solid #ff4444';
            }
            
            // Auto-hide after 5 seconds
            setTimeout(() => {
                msg.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
