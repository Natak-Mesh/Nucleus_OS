<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natak Mesh - Remote Access</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='images/NatakMeshsecondary-overlay.png') }}" alt="Natak Mesh" class="logo">
        <nav>
            <button class="nav-btn" onclick="window.location.href='/'">Network Monitor</button>
            <button class="nav-btn" onclick="window.location.href='/config'">Configuration</button>
            <button class="nav-btn" onclick="window.location.href='/scan'">Wi-Fi Scan</button>
        </nav>
    </header>

    <main>
        <div style="max-width: 600px; margin: 0 auto;">
            <h1>Remote Access</h1>
            
            <div style="background: #2d2d2d; padding: 20px; border-radius: 8px; margin: 20px 0;">
                <h2>Status: <span id="status">Loading...</span></h2>
                
                <div style="margin-top: 20px;">
                    <button id="btn-on" onclick="turnOn()" style="padding: 15px 30px; margin-right: 10px; background: #00ff88; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;">Turn On</button>
                    <button id="btn-off" onclick="turnOff()" style="padding: 15px 30px; background: #ff4444; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; font-weight: bold;">Turn Off</button>
                </div>
                
                <div id="message" style="margin-top: 20px; padding: 10px; border-radius: 4px; display: none;"></div>
            </div>
            
            <p style="color: #a0a0a0;">Raspberry Pi Connect allows remote access for troubleshooting. Connect this node to the internet and turn on remote access. Access at <a href="https://connect.raspberrypi.com" target="_blank">connect.raspberrypi.com</a></p>
        </div>
    </main>

    <script>
        loadStatus();

        function loadStatus() {
            fetch('/api/rpi-connect/status')
                .then(r => r.json())
                .then(data => {
                    document.getElementById('status').textContent = data.running ? 'Running' : 'Stopped';
                })
                .catch(err => {
                    document.getElementById('status').textContent = 'Error';
                });
        }

        function turnOn() {
            document.getElementById('btn-on').disabled = true;
            fetch('/api/rpi-connect/on', {method: 'POST'})
                .then(r => r.json())
                .then(data => {
                    showMessage(data.success ? 'Started' : data.error || 'Command sent');
                    setTimeout(loadStatus, 2000);
                    document.getElementById('btn-on').disabled = false;
                })
                .catch(err => {
                    showMessage('Command sent');
                    setTimeout(loadStatus, 2000);
                    document.getElementById('btn-on').disabled = false;
                });
        }

        function turnOff() {
            document.getElementById('btn-off').disabled = true;
            fetch('/api/rpi-connect/off', {method: 'POST'})
                .then(r => r.json())
                .then(data => {
                    showMessage(data.success ? 'Stopped' : data.error || 'Command sent');
                    setTimeout(loadStatus, 2000);
                    document.getElementById('btn-off').disabled = false;
                })
                .catch(err => {
                    showMessage('Command sent');
                    setTimeout(loadStatus, 2000);
                    document.getElementById('btn-off').disabled = false;
                });
        }

        function showMessage(text) {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.style.display = 'block';
        }
    </script>
</body>
</html>
