<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natak Mesh - Ethernet Mode</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='images/NatakMeshsecondary-overlay.png') }}" alt="Natak Mesh" class="logo">
        <nav>
            <button class="nav-btn" onclick="window.location.href='/'">Dashboard</button>
            <button class="nav-btn" onclick="window.location.href='/config'">Configuration</button>
            <button class="nav-btn" onclick="window.location.href='/scan'">Wi-Fi Scan</button>
            <button class="nav-btn" onclick="window.location.href='/remote'">Remote Access</button>
        </nav>
    </header>

    <main>
        <div class="dashboard">
            <h1>Ethernet Port Mode</h1>
            
            <div class="status-section">
                <h2>Current Status</h2>
                <div id="status-display" class="status-box">
                    <span class="loading">Loading...</span>
                </div>
            </div>

            <div class="control-section">
                <h2>Switch Mode</h2>
                <div class="button-group">
                    <button id="wan-btn" class="mode-btn" onclick="switchMode('wan')">
                        <strong>Switch to WAN</strong>
                        <small>Internet gateway (DHCP + NAT)</small>
                    </button>
                    <button id="lan-btn" class="mode-btn" onclick="switchMode('lan')">
                        <strong>Switch to LAN</strong>
                        <small>Bridge to mesh network</small>
                    </button>
                </div>
                <div id="message" class="message"></div>
            </div>

            <div class="info-section">
                <h3>Mode Descriptions</h3>
                <div class="info-box">
                    <p><strong>WAN Mode:</strong> eth0 receives IP address from your router via DHCP and shares internet connection to the mesh network using NAT.</p>
                    <p><strong>LAN Mode:</strong> eth0 is bridged to the mesh network, extending the LAN through the ethernet port.</p>
                </div>
            </div>
        </div>
    </main>

    <style>
        .status-section, .control-section, .info-section {
            margin: 20px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
        }

        .status-box {
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
            font-size: 1.2em;
            text-align: center;
        }

        .status-wan {
            color: #4CAF50;
        }

        .status-lan {
            color: #2196F3;
        }

        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 15px;
        }

        .mode-btn {
            padding: 20px;
            font-size: 1em;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: rgba(255, 255, 255, 0.1);
            color: white;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .mode-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            border-color: rgba(255, 255, 255, 0.5);
            transform: translateY(-2px);
        }

        .mode-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .mode-btn strong {
            font-size: 1.1em;
        }

        .mode-btn small {
            font-size: 0.85em;
            opacity: 0.8;
        }

        .message {
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            min-height: 20px;
        }

        .message.success {
            background: rgba(76, 175, 80, 0.2);
            border: 1px solid #4CAF50;
            color: #4CAF50;
        }

        .message.error {
            background: rgba(244, 67, 54, 0.2);
            border: 1px solid #f44336;
            color: #f44336;
        }

        .info-box {
            padding: 15px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 5px;
        }

        .info-box p {
            margin: 10px 0;
            line-height: 1.6;
        }
    </style>

    <script>
        let currentMode = null;

        async function loadStatus() {
            try {
                const response = await fetch('/api/eth0-mode/status');
                const data = await response.json();
                
                currentMode = data.current;
                updateStatusDisplay(data.current);
                updateButtons(data.current);
            } catch (error) {
                console.error('Error loading status:', error);
                document.getElementById('status-display').innerHTML = 
                    '<span class="error">Error loading status</span>';
            }
        }

        function updateStatusDisplay(mode) {
            const statusDisplay = document.getElementById('status-display');
            const modeText = mode.toUpperCase();
            const description = mode === 'wan' 
                ? 'Internet gateway (DHCP + NAT)' 
                : 'Bridged to mesh network';
            
            statusDisplay.innerHTML = `
                <span class="status-${mode}">
                    <strong>${modeText} Mode</strong> - ${description}
                </span>
            `;
        }

        function updateButtons(mode) {
            const wanBtn = document.getElementById('wan-btn');
            const lanBtn = document.getElementById('lan-btn');
            
            // Disable the button for the current mode
            wanBtn.disabled = (mode === 'wan');
            lanBtn.disabled = (mode === 'lan');
        }

        async function switchMode(mode) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = `Switching to ${mode.toUpperCase()} mode...`;
            messageDiv.className = 'message';
            
            // Disable both buttons during switch
            document.getElementById('wan-btn').disabled = true;
            document.getElementById('lan-btn').disabled = true;

            try {
                const response = await fetch('/api/eth0-mode/switch', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ mode: mode })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    messageDiv.textContent = data.message || `Successfully switched to ${mode.toUpperCase()} mode`;
                    messageDiv.className = 'message success';
                    
                    // Reload status after a short delay
                    setTimeout(() => {
                        loadStatus();
                        messageDiv.textContent = '';
                        messageDiv.className = 'message';
                    }, 3000);
                } else {
                    throw new Error(data.error || 'Failed to switch mode');
                }
            } catch (error) {
                console.error('Error switching mode:', error);
                messageDiv.textContent = `Error: ${error.message}`;
                messageDiv.className = 'message error';
                
                // Re-enable buttons and reload status
                setTimeout(() => {
                    loadStatus();
                }, 2000);
            }
        }

        // Load initial status
        loadStatus();

        // Refresh status every 30 seconds
        setInterval(loadStatus, 30000);
    </script>
</body>
</html>
