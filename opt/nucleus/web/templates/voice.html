<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Voice — Natak Mesh</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .dash { max-width: 480px; margin: 0 auto; padding: 12px; font-family: monospace; }
        .top-bar { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .top-bar .logo { height: 40px; width: auto; }
        .page-title { font-size: 20px; font-weight: bold; color: #1A09f1; }

        .status-line {
            display: flex; gap: 18px; font-size: 14px;
            margin-bottom: 14px; padding: 8px 0;
            border-bottom: 1px solid var(--border-color); flex-wrap: wrap;
        }
        .st-up { color: var(--color-connected); }
        .st-down { color: var(--color-disconnected); }
        .st-warn { color: var(--color-warning); }

        .section-hdr {
            font-size: 13px; color: var(--text-primary); font-weight: bold;
            text-transform: uppercase; letter-spacing: 1px; margin: 16px 0 8px 0;
            padding: 6px 8px; background: rgba(255,255,255,0.05);
            border-left: 3px solid var(--accent-primary); border-radius: 2px;
        }

        /* Transport toggle */
        .transport-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .transport-btn {
            flex: 1; padding: 10px 8px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color); border-radius: 8px;
            color: var(--text-secondary); font-size: 13px; font-family: monospace;
            cursor: pointer; min-height: 44px; transition: all 0.15s;
        }
        .transport-btn.active {
            background: rgba(26, 9, 241, 0.25); border-color: #1A09f1;
            color: var(--text-primary); font-weight: bold;
        }
        .transport-btn:disabled { opacity: 0.35; cursor: not-allowed; }
        .lora-meta { font-size: 12px; color: var(--text-secondary); margin: 4px 0 0 2px; }

        /* Channel picker */
        .chan-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
        .chan-btn {
            padding: 10px 16px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color); border-radius: 20px;
            color: var(--text-secondary); font-size: 14px; font-family: monospace;
            cursor: pointer; min-height: 44px; transition: all 0.15s;
        }
        .chan-btn.active {
            background: rgba(26, 9, 241, 0.25); border-color: #1A09f1;
            color: var(--text-primary); font-weight: bold;
        }

        /* PTT button */
        .ptt-wrap { text-align: center; margin: 24px 0; }
        .ptt-btn {
            width: 220px; height: 220px; border-radius: 50%;
            border: 6px solid var(--border-color);
            background: rgba(255,255,255,0.06); color: var(--text-primary);
            font-size: 22px; font-family: monospace; font-weight: bold;
            cursor: pointer; user-select: none; -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent; touch-action: none;
            transition: all 0.08s; display: inline-flex; align-items: center;
            justify-content: center; text-align: center; line-height: 1.3;
        }
        .ptt-btn:disabled { opacity: 0.4; cursor: not-allowed; }
        .ptt-btn.talking {
            background: var(--color-disconnected); border-color: #fff;
            color: #fff; transform: scale(0.97);
        }
        .ptt-hint { font-size: 12px; color: var(--text-secondary); margin-top: 10px; }

        /* Voice-text message log (LoRa transport) */
        .msg-log {
            max-height: 220px; overflow-y: auto; font-size: 13px;
            border: 1px solid var(--border-color); border-radius: 6px;
            padding: 6px 8px; background: rgba(255,255,255,0.03);
        }
        .msg-row { padding: 4px 2px; border-bottom: 1px solid rgba(255,255,255,0.06); }
        .msg-row:last-child { border-bottom: none; }
        .msg-meta { color: var(--text-secondary); font-size: 11px; }
        .msg-tx .msg-meta { color: #7a9cff; }
        .msg-rx .msg-meta { color: var(--color-connected); }
        .msg-text { color: var(--text-primary); word-break: break-word; }
        .msg-failed .msg-text { color: var(--text-secondary); font-style: italic; }

        .talkers { min-height: 24px; }
        .talker-tag {
            display: inline-block; padding: 4px 10px; margin: 3px;
            background: var(--color-connected); color: #000; border-radius: 12px;
            font-size: 13px; font-weight: bold;
        }
        .empty-msg { color: var(--text-secondary); font-size: 14px; padding: 6px 0; }

        nav { max-width: 480px; margin: 0 auto; padding: 12px 12px 0 12px; }
        .nav-btn {
            padding: 8px 14px; background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color); border-radius: 6px;
            color: var(--text-secondary); font-size: 13px; font-family: monospace;
            cursor: pointer;
        }
        .nav-btn:hover { background: rgba(26, 9, 241, 0.2); border-color: #1A09f1;
            color: var(--text-primary); }

        #banner {
            display: none; padding: 10px; border-radius: 6px; margin-bottom: 12px;
            font-size: 13px; background: rgba(255,180,0,0.15);
            border: 1px solid var(--color-warning); color: var(--text-primary);
        }
    </style>
</head>
<body>
<nav>
    <button class="nav-btn" onclick="goBack(event)">← Back to Menu</button>
</nav>
<main>
<div class="dash">

    <div class="top-bar">
        <img src="{{ url_for('static', filename='images/NatakMeshsecondary-overlay.png') }}" alt="Natak Mesh" class="logo">
        <div class="page-title">Voice PTT</div>
    </div>

    <div id="banner"></div>
    <div id="ptt-warn" style="display:none; margin:8px 0; padding:8px 12px; border:1px solid var(--color-warning); color:var(--text-primary); border-radius:4px;"></div>

    <div class="status-line">
        <span id="conn-status" class="st-down">Link: connecting…</span>
        <span id="node-status">Node: --</span>
        <span id="hw-status"></span>
    </div>

    <div class="section-hdr">Transport</div>
    <div class="transport-row">
        <button class="transport-btn active" id="tp-ip">IP Mesh<br>(real-time)</button>
        <button class="transport-btn" id="tp-lora" disabled>LoRa<br>(voice&rarr;text)</button>
    </div>
    <div class="lora-meta" id="lora-meta"></div>

    <div class="section-hdr">Channel</div>
    <div class="chan-grid" id="chan-grid">
        <div class="empty-msg">Loading channels…</div>
    </div>

    <div class="ptt-wrap">
        <button class="ptt-btn" id="ptt-btn" disabled>TALK</button>
        <div class="ptt-hint" id="ptt-hint">Press &amp; hold to talk · (or hold Spacebar)</div>
    </div>

    <div class="section-hdr">Receiving</div>
    <div class="talkers" id="talkers">
        <div class="empty-msg">No one talking</div>
    </div>

    <div class="section-hdr">Messages (LoRa voice&rarr;text)</div>
    <div class="msg-log" id="msg-log">
        <div class="empty-msg">No messages yet</div>
    </div>

</div>
</main>

<script>
// ── Force onto HTTPS/443 before anything else ──────────────────────────────
// Voice needs a secure context (mic access) AND the /voice-ws WebSocket proxy,
// both of which live only on the nginx HTTPS vhost (port 443). If this page
// was opened over http or on the Flask dev port (:5000), redirect to
// https://<same-host>/voice so it works whether reached by IP or .local.
(function () {
    if (location.protocol !== 'https:' || location.port === '5000') {
        location.replace('https://' + location.hostname + '/voice');
    }
})();

// Back to dashboard. Prefer browser history (the dashboard the user came
// from); fall back to the dashboard root on the same host+scheme. Using
// history avoids landing on OTS's page when the node was reached by IP.
function goBack(e) {
    if (e) e.preventDefault();
    if (window.history.length > 1) { window.history.back(); }
    else { location.href = location.protocol + '//' + location.host + '/'; }
}


// ── OpenVLM mesh voice — browser soft-PTT handset ──────────────────────────
// Audio: 16 kHz mono S16_LE, 20 ms frames (320 samples / 640 bytes) matching
// the daemon. Mic is captured at the device rate and downsampled to 16 kHz;
// received frames are upsampled back to the AudioContext rate for playback.


const FRAME_SAMPLES = 320;         // 20 ms @ 16 kHz
const FRAME_BYTES = FRAME_SAMPLES * 2;
const TARGET_RATE = 16000;
const JITTER_FRAMES = 4;           // ~80 ms browser playback jitter buffer

let ws = null;
let wsReady = false;
let talking = false;
let currentChannel = null;
let channels = [];
let transport = 'ip';              // 'ip' | 'lora' (mirrors daemon status)
let loraInfo = { enabled: false, ready: false, max_secs: 0 };
let clipTimer = null;              // countdown interval while keyed in LoRa mode
let clipDeadline = 0;
let messages = [];                 // voice-text history (newest last)

// Audio capture
let audioCtx = null;
let micStream = null;
let micNode = null;
let micSource = null;
let captureAccum = [];             // Float32 samples pending framing (at ctx rate)

// Audio playback
let playCtx = null;
let playQueue = [];                // Float32Array frames (at playback rate)
let playHead = 0;                  // next scheduled start time
let playing = false;

const bannerEl = document.getElementById('banner');
function banner(msg) {
    if (!msg) { bannerEl.style.display = 'none'; return; }
    bannerEl.textContent = msg;
    bannerEl.style.display = 'block';
}

// ── WebSocket ──────────────────────────────────────────────────────────────
function wsUrl() {
    const proto = (location.protocol === 'https:') ? 'wss:' : 'ws:';
    return proto + '//' + location.host + '/voice-ws';
}

function connect() {
    ws = new WebSocket(wsUrl());
    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
        wsReady = true;
        document.getElementById('conn-status').textContent = 'Link: connected';
        document.getElementById('conn-status').className = 'st-up';
        document.getElementById('ptt-btn').disabled = false;
        ws.send(JSON.stringify({ type: 'hello' }));
    };

    ws.onclose = () => {
        wsReady = false;
        document.getElementById('conn-status').textContent = 'Link: reconnecting…';
        document.getElementById('conn-status').className = 'st-warn';
        document.getElementById('ptt-btn').disabled = true;
        setTimeout(connect, 1500);
    };

    ws.onerror = () => { try { ws.close(); } catch (e) {} };

    ws.onmessage = (ev) => {
        if (typeof ev.data === 'string') {
            const msg = JSON.parse(ev.data);
            if (msg.type === 'text') { addMessage(msg.item); }
            else if (msg.type === 'texts') { messages = msg.items || []; renderMessages(); }
            else { handleStatus(msg); }
        } else {
            handleAudio(ev.data);
        }
    };
}

function handleStatus(s) {
    if (!s || s.ok === false) return;
    if (s.node_id !== undefined) {
        document.getElementById('node-status').textContent = 'Node: ' + s.node_id;
    }
    if (s.hardware !== undefined) {
        const hw = document.getElementById('hw-status');
        hw.textContent = s.hardware ? 'Headset: attached' : '';
        hw.className = s.hardware ? 'st-up' : '';
    }
    const pw = document.getElementById('ptt-warn');
    if (s.wrong_ptt) {
        pw.textContent = '\u26A0 Unsupported PTT device: ' + s.wrong_ptt +
            ' \u2014 this model cannot hold-to-talk. Plug in a supported PTT.';
        pw.style.display = 'block';
    } else {
        pw.style.display = 'none';
    }
    if (Array.isArray(s.channels)) {
        channels = s.channels;
        currentChannel = s.channel;
        renderChannels();
    } else if (s.channel !== undefined) {
        currentChannel = s.channel;
        markActiveChannel();
    }
    if (s.transport !== undefined) transport = s.transport;
    if (s.lora !== undefined) loraInfo = s.lora;
    renderTransport();
    renderTalkers(s.sources || []);
}

// ── Transport toggle ────────────────────────────────────────────────────────
function renderTransport() {
    const ipBtn = document.getElementById('tp-ip');
    const loraBtn = document.getElementById('tp-lora');
    const meta = document.getElementById('lora-meta');
    ipBtn.classList.toggle('active', transport === 'ip');
    loraBtn.classList.toggle('active', transport === 'lora');
    loraBtn.disabled = !(loraInfo.enabled && loraInfo.ready);
    if (!loraInfo.enabled) {
        meta.textContent = 'LoRa voice not enabled on this node';
    } else if (!loraInfo.ready) {
        meta.textContent = 'LoRa voice\u2192text starting (loading speech model)\u2026';
    } else if (transport === 'lora') {
        meta.textContent = loraInfo.max_secs + 's max per message';
    } else {
        meta.textContent = '';
    }
}

function setTransport(mode) {
    if (!wsReady || talking) return;
    if (mode === 'lora' && !(loraInfo.enabled && loraInfo.ready)) return;
    ws.send(JSON.stringify({ type: 'transport', mode: mode }));
    transport = mode;   // optimistic; status push will confirm
    renderTransport();
}

document.getElementById('tp-ip').onclick = () => setTransport('ip');
document.getElementById('tp-lora').onclick = () => setTransport('lora');

// ── Voice-text message log ──────────────────────────────────────────────────
function fmtTime(ts) {
    const d = new Date(ts * 1000);
    return ('0' + d.getHours()).slice(-2) + ':' +
           ('0' + d.getMinutes()).slice(-2) + ':' +
           ('0' + d.getSeconds()).slice(-2);
}

function msgRowHtml(m) {
    const dir = m.dir === 'tx' ? 'SENT' : 'Node ' + m.node;
    const cls = 'msg-row msg-' + m.dir + (m.sent === false ? ' msg-failed' : '');
    const trunc = m.truncated ? ' \u00B7 truncated' : '';
    const air = m.airtime_ms ? ' \u00B7 ' + m.airtime_ms + ' ms air' : '';
    const div = document.createElement('div');
    div.className = cls;
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.textContent = fmtTime(m.ts) + ' \u00B7 ' + dir + ' \u00B7 ch ' + m.channel + air + trunc;
    const text = document.createElement('div');
    text.className = 'msg-text';
    text.textContent = m.text;
    div.appendChild(meta);
    div.appendChild(text);
    return div;
}

function renderMessages() {
    const el = document.getElementById('msg-log');
    el.innerHTML = '';
    if (!messages.length) {
        el.innerHTML = '<div class="empty-msg">No messages yet</div>';
        return;
    }
    messages.forEach(m => el.appendChild(msgRowHtml(m)));
    el.scrollTop = el.scrollHeight;
}

function addMessage(item) {
    if (!item) return;
    messages.push(item);
    if (messages.length > 50) messages.splice(0, messages.length - 50);
    renderMessages();
    // Own transcript confirms the send: clear the SENDING… state early.
    if (item.dir === 'tx') {
        const btn = document.getElementById('ptt-btn');
        if (!talking && btn.textContent !== 'TALK') btn.textContent = 'TALK';
    }
}

// ── LoRa clip countdown (while keyed in voice-text mode) ────────────────────
function startClipCountdown() {
    if (transport !== 'lora' || !loraInfo.max_secs) return;
    clipDeadline = Date.now() + loraInfo.max_secs * 1000;
    updateClipCountdown();
    clipTimer = setInterval(updateClipCountdown, 100);
}

function updateClipCountdown() {
    const remain = Math.max(0, (clipDeadline - Date.now()) / 1000);
    const btn = document.getElementById('ptt-btn');
    if (remain <= 0) {
        btn.textContent = 'SENT';   // daemon auto-sent at the clip limit
        clearInterval(clipTimer); clipTimer = null;
    } else {
        btn.textContent = remain.toFixed(1) + 's';
    }
}

function stopClipCountdown(sent) {
    if (clipTimer) { clearInterval(clipTimer); clipTimer = null; }
    const btn = document.getElementById('ptt-btn');
    if (sent && transport === 'lora') {
        btn.textContent = 'SENDING\u2026';   // cleared by the tx text event
        setTimeout(() => { if (!talking) btn.textContent = 'TALK'; }, 3000);
    } else {
        btn.textContent = 'TALK';
    }
}

function renderChannels() {
    const grid = document.getElementById('chan-grid');
    if (!channels.length) { grid.innerHTML = '<div class="empty-msg">No channels</div>'; return; }
    grid.innerHTML = '';
    channels.forEach(ch => {
        const b = document.createElement('button');
        b.className = 'chan-btn' + (ch.n === currentChannel ? ' active' : '');
        b.textContent = ch.n + ': ' + ch.label;
        b.dataset.n = ch.n;
        b.onclick = () => selectChannel(ch.n);
        grid.appendChild(b);
    });
}

function markActiveChannel() {
    document.querySelectorAll('.chan-btn').forEach(b => {
        b.classList.toggle('active', parseInt(b.dataset.n, 10) === currentChannel);
    });
}

function selectChannel(n) {
    if (!wsReady) return;
    ws.send(JSON.stringify({ type: 'channel', n: n }));
    currentChannel = n;
    markActiveChannel();
}

function renderTalkers(sources) {
    const el = document.getElementById('talkers');
    if (!sources.length) { el.innerHTML = '<div class="empty-msg">No one talking</div>'; return; }
    el.innerHTML = sources.map(id => '<span class="talker-tag">Node ' + id + '</span>').join('');
}

// ── Playback (mixed RX audio from the mesh) ─────────────────────────────────
function ensurePlayCtx() {
    if (!playCtx) {
        playCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (playCtx.state === 'suspended') playCtx.resume();
}

function handleAudio(arrbuf) {
    // Real-time only: if playback isn't running (autoplay policy / suspended),
    // drop the audio rather than queueing it — otherwise the backlog plays
    // later like a recording.
    if (!playCtx || playCtx.state !== 'running') return;
    const view = new DataView(arrbuf);
    const n = Math.floor(arrbuf.byteLength / 2);
    // Convert S16LE -> Float32 at 16 kHz, then resample to playback rate.
    const src = new Float32Array(n);
    for (let i = 0; i < n; i++) {
        src[i] = view.getInt16(i * 2, true) / 32768;
    }
    const ratio = playCtx.sampleRate / TARGET_RATE;
    const outLen = Math.round(n * ratio);
    const out = new Float32Array(outLen);
    for (let i = 0; i < outLen; i++) {
        const srcPos = i / ratio;
        const i0 = Math.floor(srcPos);
        const i1 = Math.min(i0 + 1, n - 1);
        const frac = srcPos - i0;
        out[i] = src[i0] * (1 - frac) + src[i1] * frac;
    }
    playQueue.push(out);
    // Bound backlog: keep at most 2x jitter buffer, drop oldest (stay live).
    while (playQueue.length > JITTER_FRAMES * 2) playQueue.shift();
    if (playQueue.length > JITTER_FRAMES && !playing) startPlayback();
    schedulePlayback();
}

function startPlayback() {
    playing = true;
    playHead = playCtx.currentTime + 0.02;
}

function schedulePlayback() {
    if (!playing) return;
    // If we've scheduled far ahead of real time (e.g. context was suspended),
    // resync instead of letting a backlog play out late.
    if (playHead > playCtx.currentTime + 0.5) {
        playHead = playCtx.currentTime + 0.02;
    }
    while (playQueue.length) {
        const frame = playQueue.shift();
        const buf = playCtx.createBuffer(1, frame.length, playCtx.sampleRate);
        buf.getChannelData(0).set(frame);
        const node = playCtx.createBufferSource();
        node.buffer = buf;
        node.connect(playCtx.destination);
        const now = playCtx.currentTime;
        if (playHead < now) playHead = now + 0.01;   // fell behind, resync
        node.start(playHead);
        playHead += frame.length / playCtx.sampleRate;
    }
}

// ── Capture (mic -> mesh while PTT held) ────────────────────────────────────
async function ensureMic() {
    if (micStream) return true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        banner('Microphone unavailable. The voice page must be opened over ' +
               'HTTPS (https://…-nucleus.local) for the browser to allow mic access.');
        return false;
    }
    try {
        micStream = await navigator.mediaDevices.getUserMedia({
            audio: { channelCount: 1, echoCancellation: true,
                     noiseSuppression: true, autoGainControl: true },
            video: false
        });
    } catch (e) {
        banner('Microphone permission denied: ' + e.message);
        return false;
    }
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    micSource = audioCtx.createMediaStreamSource(micStream);
    // ScriptProcessor is deprecated but universally supported on mobile.
    micNode = audioCtx.createScriptProcessor(2048, 1, 1);
    micNode.onaudioprocess = onMicData;
    micSource.connect(micNode);
    micNode.connect(audioCtx.destination);   // required for the node to run
    banner('');
    return true;
}

function onMicData(ev) {
    if (!talking || !wsReady) return;
    const input = ev.inputBuffer.getChannelData(0);
    // Downsample from audioCtx.sampleRate to 16 kHz (linear interp) and frame.
    const ratio = audioCtx.sampleRate / TARGET_RATE;
    for (let i = 0; i < input.length; i++) captureAccum.push(input[i]);
    const needed = FRAME_SAMPLES * ratio;
    while (captureAccum.length >= needed) {
        const frame = new Int16Array(FRAME_SAMPLES);
        for (let j = 0; j < FRAME_SAMPLES; j++) {
            const pos = j * ratio;
            const i0 = Math.floor(pos);
            const i1 = Math.min(i0 + 1, captureAccum.length - 1);
            const frac = pos - i0;
            let s = captureAccum[i0] * (1 - frac) + captureAccum[i1] * frac;
            s = Math.max(-1, Math.min(1, s));
            frame[j] = s < 0 ? s * 32768 : s * 32767;
        }
        captureAccum.splice(0, Math.round(needed));
        if (ws && wsReady) ws.send(frame.buffer);
    }
}

// ── PTT control ─────────────────────────────────────────────────────────────
// pttHeld tracks the PHYSICAL button state. pttDown() awaits mic setup, and
// on first use the button can be released (touchend) before that await
// resolves — without this check, talking would then latch on.
let pttHeld = false;

async function pttDown() {
    pttHeld = true;
    if (talking || !wsReady) return;
    ensurePlayCtx();
    const ok = await ensureMic();
    if (!ok || !pttHeld || talking) return;  // released during setup: don't latch
    talking = true;
    captureAccum = [];
    document.getElementById('ptt-btn').classList.add('talking');
    ws.send(JSON.stringify({ type: 'ptt', down: true }));
    startClipCountdown();
}

function pttUp() {
    pttHeld = false;
    if (!talking) return;
    talking = false;
    document.getElementById('ptt-btn').classList.remove('talking');
    if (ws && wsReady) ws.send(JSON.stringify({ type: 'ptt', down: false }));
    stopClipCountdown(true);
}

const pttBtn = document.getElementById('ptt-btn');
pttBtn.addEventListener('mousedown', (e) => { e.preventDefault(); pttDown(); });
pttBtn.addEventListener('mouseup', (e) => { e.preventDefault(); pttUp(); });
pttBtn.addEventListener('mouseleave', () => pttUp());
pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); pttDown(); }, { passive: false });
pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); pttUp(); }, { passive: false });
pttBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); pttUp(); }, { passive: false });

document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !e.repeat) { e.preventDefault(); pttDown(); }
});
document.addEventListener('keyup', (e) => {
    if (e.code === 'Space') { e.preventDefault(); pttUp(); }
});

// Arm/resume playback on user interaction (mobile autoplay policy). Not
// {once:true}: the context can re-suspend (tab switch), so resume every time.
document.body.addEventListener('click', ensurePlayCtx);
