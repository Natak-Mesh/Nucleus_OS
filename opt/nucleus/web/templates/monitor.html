<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natak Mesh - Network Monitor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        header {
            position: relative;
            justify-content: center;
        }
        header nav {
            position: absolute;
            right: 16px;
        }
    </style>
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='images/NatakMeshsecondary-overlay.png') }}" alt="Natak Mesh" class="logo">
        <nav>
            <button class="nav-btn" onclick="window.location.href='/'">← Back to Menu</button>
        </nav>
    </header>

    <main>
        <div class="dashboard">
            <h1>Connected Nodes</h1>
            <div id="channel-util" style="margin-bottom: 12px; font-size: 14px; color: #a0a0a0;">
                <span class="label">Channel Congestion:</span>
                <span id="channel-util-value" class="value">--</span>
            </div>
            <div id="node-container" class="node-grid">
                <div class="loading">Loading mesh nodes...</div>
            </div>
            <div id="last-update">Last updated: Never</div>
        </div>
    </main>

    <script>
        const REFRESH_INTERVAL = {{ refresh_interval }} * 1000; // Convert to milliseconds
        let updateInterval;

        async function fetchNodes() {
            try {
                const response = await fetch('/api/nodes');
                const data = await response.json();
                renderNodes(data.nodes);
                renderChannelUtil(data.channel_utilization);
                updateTimestamp(data.timestamp);
            } catch (error) {
                console.error('Error fetching nodes:', error);
                document.getElementById('node-container').innerHTML = '<div class="error">Error loading mesh data</div>';
            }
        }

        function renderChannelUtil(util) {
            const el = document.getElementById('channel-util-value');
            if (!util) {
                el.textContent = '--';
                el.className = 'value';
                return;
            }
            el.textContent = `Ch ${util.channel}: ${util.busy_pct}% congestion`;
            el.className = `value signal-${util.quality}`;
        }

        // Babel cost → link %: cost is ETX-based, 256 = perfect delivery.
        function linkPct(cost) {
            const c = parseInt(cost, 10);
            if (!c || c <= 0) return null;
            return Math.min(100, Math.round((256 / c) * 100));
        }

        function renderNodes(nodes) {
            const container = document.getElementById('node-container');
            
            if (nodes.length === 0) {
                container.innerHTML = '<div class="no-nodes">No mesh nodes detected</div>';
                return;
            }

            container.innerHTML = nodes.map(node => `
                <div class="node-card ${node.status}">
                    <div class="node-header">
                        <span class="node-ip">${node.ipv4}</span>
                        <span class="status-indicator ${node.status}">${node.status === 'connected' ? '●' : '○'}</span>
                    </div>
                    <div class="node-body">
                        <div class="node-metric">
                            <span class="label">Link:</span>
                            <span class="value cost-${node.cost_quality || 'unknown'}">${linkPct(node.cost) !== null ? linkPct(node.cost) + '%' : 'N/A'} <span style="color:#a0a0a0;font-size:12px;">(cost ${node.cost})</span></span>
                        </div>
                        <div class="node-duration">
                            <span class="label">${node.duration_label}:</span>
                            <span class="value">${node.duration}</span>
                        </div>
                        ${node.wifi ? `
                        <div class="node-wifi">
                            <div class="wifi-header">WiFi Performance</div>
                            ${node.wifi.signal_avg !== null ? `
                            <div class="wifi-metric">
                                <span class="label">Signal:</span>
                                <span class="value signal-${node.wifi.signal_quality}">${node.wifi.signal_avg} dBm</span>
                            </div>
                            ` : ''}
                            ${node.wifi.tx_bitrate !== null ? `
                            <div class="wifi-metric">
                                <span class="label">TX Rate:</span>
                                <span class="value">${node.wifi.tx_bitrate} Mbps${node.wifi.tx_mcs !== null ? ` (MCS ${node.wifi.tx_mcs})` : ''}</span>
                            </div>
                            ` : ''}
                            ${node.wifi.rx_bitrate !== null ? `
                            <div class="wifi-metric">
                                <span class="label">RX Rate:</span>
                                <span class="value">${node.wifi.rx_bitrate} Mbps${node.wifi.rx_mcs !== null ? ` (MCS ${node.wifi.rx_mcs})` : ''}</span>
                            </div>
                            ` : ''}
                            ${node.wifi.expected_throughput !== null ? `
                            <div class="wifi-metric">
                                <span class="label">Throughput:</span>
                                <span class="value">${node.wifi.expected_throughput.toFixed(1)} Mbps</span>
                            </div>
                            ` : ''}
                            ${node.wifi.link_quality !== null ? `
                            <div class="wifi-metric">
                                <span class="label">Link Quality:</span>
                                <span class="value signal-${node.wifi.link_quality_status}">${node.wifi.link_quality} (${node.wifi.link_quality_status})</span>
                            </div>
                            ` : ''}
                        </div>
                        ` : ''}
                        ${node.routes && node.routes.length > 0 ? `
                        <div class="node-routes">
                            <span class="label">Gateway to:</span>
                            <ul class="routes-list">
                                ${node.routes.map(route => `
                                    <li class="${route.installed ? 'route-active' : 'route-available'}">
                                        ${route.prefix} 
                                        <span class="route-cost">(cost: ${route.metric})</span>
                                        <span class="route-status">${route.installed ? '✓ active' : '○ available'}</span>
                                    </li>
                                `).join('')}
                            </ul>
                        </div>
                        ` : ''}
                    </div>
                    <div class="node-status-label ${node.status}">
                        ${node.status.toUpperCase()}
                    </div>
                </div>
            `).join('');
        }

        function updateTimestamp(timestamp) {
            const date = new Date(timestamp);
            const timeString = date.toLocaleTimeString();
            document.getElementById('last-update').textContent = `Last updated: ${timeString}`;
        }

        // Initial fetch
        fetchNodes();

        // Set up auto-refresh
        updateInterval = setInterval(fetchNodes, REFRESH_INTERVAL);

        // Refresh on visibility change
        document.addEventListener('visibilitychange', () => {
            if (!document.hidden) {
                fetchNodes();
            }
        });
    </script>
</body>
</html>
