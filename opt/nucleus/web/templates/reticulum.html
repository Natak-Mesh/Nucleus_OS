<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Natak Mesh - Reticulum Status</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        /* Stacked rows */
        .rt-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 8px 0;
            font-size: 14px;
            font-family: monospace;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .rt-row:last-child { border-bottom: none; }
        .rt-row .rt-name { color: var(--text-primary); }
        .rt-row .rt-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
            font-family: monospace;
        }
        .rt-row .dim { color: var(--text-secondary); }

        /* Status dot */
        .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .dot-green { background: var(--color-connected); }
        .dot-red { background: var(--color-disconnected); }
        .dot-yellow { background: var(--color-warning); }

        /* Big number in cards */
        .big-num {
            font-size: 48px;
            font-weight: bold;
            margin: 12px 0;
        }
        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
        }
        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 4px 0;
            font-size: 13px;
        }
        .stat-row .label { color: var(--text-secondary); }
        .stat-row .value { color: var(--text-primary); font-family: monospace; }

        /* Connection type badges */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 11px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .badge-up {
            background: rgba(0, 255, 136, 0.1);
            color: var(--color-connected);
            border: 1px solid rgba(0, 255, 136, 0.2);
        }
        .badge-down {
            background: rgba(255, 0, 0, 0.1);
            color: var(--color-disconnected);
            border: 1px solid rgba(255, 0, 0, 0.2);
        }
        .badge-type {
            background: rgba(26, 9, 241, 0.2);
            color: #7B73FF;
            border: 1px solid rgba(26, 9, 241, 0.3);
        }

        /* Empty state */
        .empty-msg {
            text-align: center;
            color: var(--text-secondary);
            padding: 16px;
            font-size: 13px;
        }

        /* Actions */
        .actions-row {
            display: flex;
            justify-content: center;
            gap: 12px;
            margin-top: 24px;
            flex-wrap: wrap;
        }
    </style>
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='images/NatakMeshsecondary-overlay.png') }}" alt="Natak Mesh" class="logo">
        <nav>
            <button class="nav-btn" onclick="window.location.href='/'">← Back to Menu</button>
        </nav>
    </header>

    <main>
        <div class="dashboard">
            <h1>Reticulum Status</h1>

            <!-- Summary Card -->
            <div id="summary-card" class="node-grid">
                <div class="loading">Loading Reticulum status...</div>
            </div>

            <!-- Interfaces Section -->
            <div id="ifaces-section" style="display: none; margin-top: 24px;">
                <div class="node-card">
                    <div class="node-header">
                        <span class="node-ip">Interfaces</span>
                    </div>
                    <div id="ifaces-body"></div>
                </div>
            </div>

            <!-- Mesh Nodes Section -->
            <div id="mesh-nodes-section" style="display: none; margin-top: 24px;">
                <div class="node-card">
                    <div class="node-header">
                        <span class="node-ip">Mesh Peers</span>
                    </div>
                    <div id="mesh-nodes-body"></div>
                </div>
            </div>

            <!-- Actions -->
            <div id="actions-section" style="display: none;">
                <div class="actions-row">
                    <button class="nav-btn" onclick="refreshStatus()">Refresh Status</button>
                    <button class="nav-btn" id="restart-btn" onclick="restartRnsd()" style="background-color: var(--color-warning);">Restart rnsd</button>
                </div>
            </div>

            <div id="last-update" style="text-align: center; color: var(--text-secondary); font-size: 12px; margin-top: 16px;"></div>
        </div>
    </main>

    <script>
        function formatBytes(bytes) {
            if (bytes === 0 || bytes == null) return '0 B';
            const units = ['B', 'KB', 'MB', 'GB'];
            let i = 0;
            let val = bytes;
            while (val >= 1024 && i < units.length - 1) { val /= 1024; i++; }
            return (i === 0 ? val : val.toFixed(1)) + ' ' + units[i];
        }

        function formatUptime(seconds) {
            if (!seconds) return '--';
            const s = Math.floor(seconds);
            const d = Math.floor(s / 86400);
            const h = Math.floor((s % 86400) / 3600);
            const m = Math.floor((s % 3600) / 60);
            let parts = [];
            if (d > 0) parts.push(d + 'd');
            if (h > 0) parts.push(h + 'h');
            parts.push(m + 'm');
            return parts.join(' ');
        }

        async function refreshStatus() {
            try {
                const r = await fetch('/api/reticulum/status');
                const d = await r.json();
                renderStatus(d);
            } catch (e) {
                console.error('Error:', e);
                document.getElementById('summary-card').innerHTML = '<div class="error">Error loading Reticulum status</div>';
            }
        }

        function renderStatus(d) {
            const ifaces = d.interfaces || [];
            const destCount = d.destinations_count || 0;

            // ── Categorize interfaces ──
            const meshPeers = [];     // AutoInterfacePeer entries
            const configIfaces = [];  // All non-peer, non-internal interfaces

            ifaces.forEach(iface => {
                if (iface.type === 'AutoInterfacePeer') {
                    meshPeers.push(iface);
                } else if (iface.type === 'LocalClientInterface') {
                    // skip - internal plumbing
                } else {
                    configIfaces.push(iface);
                }
            });

            // ── Summary Card ──
            const hasData = d.transport_uptime != null;
            const summaryColor = hasData ? 'var(--color-connected)' : 'var(--color-warning)';

            document.getElementById('summary-card').innerHTML = `
                <div class="node-card ${hasData ? 'connected' : ''}">
                    <div class="node-header">
                        <span class="node-ip">Reticulum Transport</span>
                    </div>
                    <div class="node-body" style="text-align: center;">
                        <div class="big-num" style="color: ${summaryColor};">
                            ${destCount}
                        </div>
                        <div class="stat-label">Reachable Destinations</div>
                    </div>
                    <div style="padding: 0 4px;">
                        <div class="stat-row">
                            <span class="label">Uptime:</span>
                            <span class="value">${formatUptime(d.transport_uptime)}</span>
                        </div>
                        <div class="stat-row">
                            <span class="label">Traffic:</span>
                            <span class="value">↑${formatBytes(d.txb)}  ↓${formatBytes(d.rxb)}</span>
                        </div>
                        <div class="stat-row">
                            <span class="label">Interfaces:</span>
                            <span class="value">${configIfaces.length}</span>
                        </div>
                        <div class="stat-row">
                            <span class="label">Mesh Peers:</span>
                            <span class="value">${meshPeers.length}</span>
                        </div>
                    </div>
                </div>
            `;

            // ── Interfaces Table ──
            const ifaceSec = document.getElementById('ifaces-section');
            const ifaceBody = document.getElementById('ifaces-body');

            if (configIfaces.length > 0) {
                ifaceSec.style.display = 'block';
                let h = '<div style="padding: 4px 8px;">';

                configIfaces.forEach(iface => {
                    let name = iface.name || 'unknown';
                    const nameMatch = name.match(/\[(.+)\]/);
                    const displayName = nameMatch ? nameMatch[1] : name;

                    let typeLabel = (iface.type || '').replace('Interface', '');

                    const up = iface.status === true;
                    const dotClass = up ? 'dot-green' : 'dot-red';
                    const statusText = up ? 'Up' : 'Down';

                    let clientInfo = '';
                    if (iface.clients != null && iface.clients > 0) {
                        clientInfo = ` (${iface.clients})`;
                    }

                    const statusColor = up ? 'var(--color-connected)' : 'var(--color-disconnected)';

                    h += `<div class="rt-row">
                        <div>
                            <div class="rt-name">${displayName}${clientInfo}</div>
                            <div class="rt-meta">${typeLabel}</div>
                        </div>
                        <div style="color: ${statusColor}; white-space: nowrap;">${statusText}</div>
                    </div>`;
                });
                h += '</div>';
                ifaceBody.innerHTML = h;
            } else {
                ifaceSec.style.display = 'block';
                ifaceBody.innerHTML = '<div class="empty-msg">No interfaces configured</div>';
            }

            // ── Mesh Peers Table ──
            const meshSec = document.getElementById('mesh-nodes-section');
            const meshBody = document.getElementById('mesh-nodes-body');

            if (meshPeers.length > 0) {
                meshSec.style.display = 'block';
                let mh = '<div style="padding: 4px 8px;">';

                meshPeers.forEach(peer => {
                    const nameMatch = peer.name.match(/\[(.+)\]/);
                    let peerName = nameMatch ? nameMatch[1] : peer.name;
                    // Strip wlan1/ prefix, show just the link-local
                    peerName = peerName.replace(/^wlan1\//, '');

                    const up = peer.status === true;
                    const statusText = up ? 'Up' : 'Down';
                    const statusColor = up ? 'var(--color-connected)' : 'var(--color-disconnected)';

                    mh += `<div class="rt-row">
                        <div>
                            <div class="rt-name">${peerName}</div>
                            <div class="rt-meta">↑${formatBytes(peer.txb)}  ↓${formatBytes(peer.rxb)}</div>
                        </div>
                        <div style="color: ${statusColor}; white-space: nowrap;">${statusText}</div>
                    </div>`;
                });
                mh += '</div>';
                meshBody.innerHTML = mh;
            } else {
                meshSec.style.display = 'none';
            }

            // Show actions
            document.getElementById('actions-section').style.display = 'block';

            // Timestamp
            document.getElementById('last-update').textContent = 'Updated ' + new Date().toLocaleTimeString();
        }

        async function restartRnsd() {
            if (!confirm('Are you sure you want to restart the Reticulum daemon (rnsd)?')) return;

            const btn = document.getElementById('restart-btn');
            btn.disabled = true;
            btn.textContent = 'Restarting...';

            try {
                const r = await fetch('/api/reticulum/restart', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'}
                });
                const result = await r.json();

                if (result.success) {
                    alert('rnsd restarted successfully');
                    setTimeout(refreshStatus, 3000);
                } else {
                    alert('Error: ' + (result.error || 'Unknown error'));
                }
            } catch (e) {
                console.error('Error restarting rnsd:', e);
                alert('Error restarting rnsd: ' + e.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Restart rnsd';
            }
        }

        // Initial load and auto-refresh
        refreshStatus();
        setInterval(refreshStatus, 10000);
        document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshStatus(); });
    </script>
</body>
</html>
