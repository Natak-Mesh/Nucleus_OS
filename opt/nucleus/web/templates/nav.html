<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Natak Mesh</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .dash {
            max-width: 480px;
            margin: 0 auto;
            padding: 12px;
            font-family: monospace;
        }

        /* ── Header: logo + IP ── */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .top-bar .logo {
            height: 48px;
            width: auto;
        }
        .mesh-ip {
            font-size: 32px;
            font-weight: bold;
            color: #1A09f1;
            font-family: monospace;
        }

        /* ── Status line ── */
        .status-line {
            display: flex;
            gap: 24px;
            font-size: 15px;
            margin-bottom: 16px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .st-up { color: var(--color-connected); }
        .st-down { color: var(--color-disconnected); }

        /* ── Section headers ── */
        .section-hdr {
            font-size: 13px;
            color: var(--text-primary);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 16px 0 8px 0;
            padding: 6px 8px;
            background: rgba(255,255,255,0.05);
            border-left: 3px solid var(--accent-primary);
            border-radius: 2px;
        }

        /* ── Compact list rows ── */
        .conn-row {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 6px 0;
            font-size: 15px;
            font-family: monospace;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .conn-row .node-id {
            color: var(--text-primary);
        }
        .conn-row .q-good { color: var(--color-connected); }
        .conn-row .q-fair { color: var(--color-warning); }
        .conn-row .q-poor { color: var(--color-disconnected); }
        .conn-row .q-lost {
            color: var(--text-secondary);
            opacity: 0.5;
        }

        /* Meshtastic freshness colors */
        .conn-row .fresh { color: var(--color-connected); }
        .conn-row .stale { color: var(--color-warning); }
        .conn-row .old { color: var(--text-secondary); opacity: 0.5; }

        .mesh-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
            margin-bottom: 8px;
        }

        .empty-msg {
            color: var(--text-secondary);
            font-size: 14px;
            padding: 6px 0;
        }

        /* ── Collapsible nav ── */
        .tools-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 0 8px 0;
            margin-top: 12px;
            border-top: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .tools-toggle:hover { color: var(--text-primary); }
        .tools-toggle .arrow {
            transition: transform 0.2s;
            font-size: 12px;
        }
        .tools-toggle.open .arrow {
            transform: rotate(90deg);
        }
        .tools-body {
            display: none;
            padding: 4px 0 8px 0;
        }
        .tools-body.open { display: block; }
        .tools-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .pill {
            padding: 10px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-family: monospace;
            transition: all 0.2s;
            min-height: 44px;
            display: flex;
            align-items: center;
        }
        .pill:hover {
            background: rgba(26, 9, 241, 0.2);
            border-color: #1A09f1;
            color: var(--text-primary);
        }
        .btn-shutdown {
            padding: 10px 28px;
            background: var(--color-disconnected);
            border: none;
            border-radius: 20px;
            color: #fff;
            font-size: 13px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            min-height: 44px;
        }
        .btn-shutdown:hover { opacity: 0.8; }
        .btn-shutdown:disabled { opacity: 0.4; cursor: not-allowed; }

        #last-update {
            text-align: center;
            color: var(--text-secondary);
            font-size: 11px;
            margin-top: 12px;
        }
    </style>
</head>
<body>
    <main>
        <div class="dash">

            <!-- Logo + IP -->
            <div class="top-bar">
                <img src="{{ url_for('static', filename='images/NatakMeshsecondary-overlay.png') }}" alt="Natak Mesh" class="logo">
                <div class="mesh-ip" id="mesh-ip">--</div>
            </div>

            <!-- Mesh status -->
            <div class="status-line">
                <span id="wlan1-status" class="st-down">Mesh: --</span>
            </div>

            <!-- WiFi Mesh Neighbors -->
            <div class="section-hdr" id="wifi-hdr">WiFi Mesh</div>
            <div id="nb-container">
                <div class="empty-msg">Loading...</div>
            </div>

            <!-- Meshtastic Nodes -->
            <div class="section-hdr">Meshtastic</div>
            <div id="mesh-radio-container">
                <div class="empty-msg">Loading...</div>
            </div>

            <!-- Collapsible Tools & Settings -->
            <div class="tools-toggle" id="tools-toggle" onclick="toggleTools()">
                <span class="arrow">▶</span> Tools &amp; Settings
            </div>
            <div class="tools-body" id="tools-body">
                <div class="tools-grid">
                    <a href="/monitor" class="pill">Monitor</a>
                    <a href="/config" class="pill">Config</a>
                    <a href="/scan" class="pill">Wi-Fi Scan</a>
                    <a href="/remote" class="pill">Remote</a>
                    <a href="/ethernet" class="pill">Ethernet</a>
                    <a href="/opendht" class="pill">OpenDHT</a>
                    <a href="/meshtastic" class="pill">Meshtastic</a>
                    <a href="/reticulum" class="pill">Reticulum</a>
                    <a href="/opentakserver" class="pill">OpenTAKServer</a>
                </div>
                <div style="text-align: center;">
                    <button class="btn-shutdown" id="btn-shutdown" onclick="shutdownNode()">Shutdown Node</button>
                </div>
            </div>

            <!-- Shutdown (always visible) -->
            <div style="text-align: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border-color);">
                <button class="btn-shutdown" id="btn-shutdown2" onclick="shutdownNode()">Shutdown Node</button>
            </div>

            <div id="last-update"></div>
        </div>
    </main>

    <script>
        function toggleTools() {
            const toggle = document.getElementById('tools-toggle');
            const body = document.getElementById('tools-body');
            toggle.classList.toggle('open');
            body.classList.toggle('open');
        }

        function formatAge(lastHeard) {
            if (!lastHeard) return '?';
            const secs = Math.floor(Date.now() / 1000) - lastHeard;
            if (secs < 0) return 'now';
            if (secs < 60) return secs + 's ago';
            if (secs < 3600) return Math.floor(secs / 60) + 'm ago';
            if (secs < 86400) return Math.floor(secs / 3600) + 'h ago';
            return Math.floor(secs / 86400) + 'd ago';
        }

        function freshnessClass(lastHeard) {
            if (!lastHeard) return 'old';
            const secs = Math.floor(Date.now() / 1000) - lastHeard;
            if (secs < 300) return 'fresh';   // < 5 min
            if (secs < 1800) return 'stale';  // < 30 min
            return 'old';
        }

        async function refresh() {
            try {
                const r = await fetch('/api/dashboard');
                const d = await r.json();

                // Mesh IP
                document.getElementById('mesh-ip').textContent = d.mesh_ip || 'N/A';

                // wlan1 status
                const w = document.getElementById('wlan1-status');
                if (d.wlan1.active) {
                    w.textContent = 'Mesh Ch' + (d.wlan1.channel || '?');
                    w.className = 'st-up';
                } else {
                    w.textContent = 'Mesh: Down';
                    w.className = 'st-down';
                }

                // WiFi section header with channel utilization
                const wifiHdr = document.getElementById('wifi-hdr');
                const cu = d.channel_utilization;
                if (cu) {
                    var busyColor = cu.busy_pct < 30 ? 'var(--color-connected)' :
                                    cu.busy_pct < 50 ? '#66ff66' :
                                    cu.busy_pct < 70 ? 'var(--color-warning)' :
                                    'var(--color-disconnected)';
                    wifiHdr.innerHTML = 'WiFi Mesh <span style="float:right;font-size:14px;color:' + busyColor + ';text-transform:none;letter-spacing:0">' + cu.busy_pct + '% busy</span>';
                } else {
                    wifiHdr.textContent = 'WiFi Mesh';
                }

                // WiFi Mesh Neighbors
                const nb = document.getElementById('nb-container');
                if (!d.neighbors || d.neighbors.length === 0) {
                    nb.innerHTML = '<div class="empty-msg">No mesh neighbors</div>';
                } else {
                    let h = '';
                    d.neighbors.forEach(function(n) {
                        if (n.status === 'connected') {
                            const q = n.cost_quality || 'unknown';
                            const label = q.charAt(0).toUpperCase() + q.slice(1);
                            h += '<div class="conn-row">'
                               + '<span class="node-id">' + n.ip + '</span>'
                               + '<span class="q-' + q + '">' + label + ' (' + n.cost + ')</span>'
                               + '</div>';
                        } else {
                            h += '<div class="conn-row">'
                               + '<span class="node-id">' + n.ip + '</span>'
                               + '<span class="q-lost">lost</span>'
                               + '</div>';
                        }
                    });
                    nb.innerHTML = h;
                }

                // Meshtastic
                const mc = document.getElementById('mesh-radio-container');
                const m = d.meshtastic || {};
                let mh = '';

                if (m.nodes && m.nodes.length > 0) {
                    m.nodes.forEach(function(node) {
                        const cls = freshnessClass(node.last_heard);
                        const age = formatAge(node.last_heard);
                        mh += '<div class="conn-row">'
                            + '<span class="node-id">' + node.short_name + '</span>'
                            + '<span class="' + cls + '">' + age + '</span>'
                            + '</div>';
                    });
                } else {
                    mh += '<div class="empty-msg">No nodes heard</div>';
                }

                // Radio / bridge status line
                const radioTxt = m.radio_detected ? 'Radio ✓' : 'No radio';
                const bridgeTxt = m.bridge_enabled ? 'Bridge ON' : 'BLE mode';
                const radioClass = m.radio_detected ? 'st-up' : 'st-down';
                mh += '<div class="mesh-meta">'
                    + '<span class="' + radioClass + '">' + radioTxt + '</span>'
                    + ' · ' + bridgeTxt
                    + '</div>';

                mc.innerHTML = mh;

                // Timestamp
                const t = new Date(d.timestamp);
                document.getElementById('last-update').textContent = 'Updated ' + t.toLocaleTimeString();

            } catch (e) {
                console.error('Dashboard fetch error:', e);
            }
        }

        async function shutdownNode() {
            if (!confirm('Shut down this node?\nYou will need to unplug and replug power to restart.')) return;
            var btn = document.getElementById('btn-shutdown');
            btn.disabled = true;
            btn.textContent = 'Shutting down...';
            try {
                await fetch('/api/shutdown', { method: 'POST' });
            } catch (e) { /* expected — node is powering off */ }
        }

        refresh();
        setInterval(refresh, 5000);
        document.addEventListener('visibilitychange', function() { if (!document.hidden) refresh(); });
    </script>
</body>
</html>
