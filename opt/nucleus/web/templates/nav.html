<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Natak Mesh</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        .dash {
            max-width: 480px;
            margin: 0 auto;
            padding: 12px;
            font-family: monospace;
        }

        /* ── Header: logo + IP ── */
        .top-bar {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 12px;
        }
        .top-bar .logo {
            height: 48px;
            width: auto;
        }
        .mesh-ip {
            font-size: 32px;
            font-weight: bold;
            color: #1A09f1;
            font-family: monospace;
        }

        /* ── Status line ── */
        .status-line {
            display: flex;
            gap: 24px;
            font-size: 15px;
            margin-bottom: 16px;
            padding: 8px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .st-up { color: var(--color-connected); }
        .st-down { color: var(--color-disconnected); }

        /* ── Section headers ── */
        .section-hdr {
            font-size: 13px;
            color: var(--text-primary);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin: 16px 0 4px 0;
            padding: 6px 8px;
            background: rgba(255,255,255,0.05);
            border-left: 3px solid var(--accent-primary);
            border-radius: 2px;
        }

        /* ── Column header row ── */
        .col-hdr {
            display: grid;
            font-size: 11px;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 6px 4px 4px 4px;
            border-bottom: 1px solid rgba(255,255,255,0.08);
        }
        .col-hdr.wifi-cols { grid-template-columns: 1fr 80px 60px; }
        .col-hdr.mesht-cols { grid-template-columns: 1fr 70px 62px 72px; }
        .col-hdr span:not(:first-child) { text-align: right; }

        /* ── Data rows (grid, phone-friendly) ── */
        .conn-row {
            display: grid;
            align-items: baseline;
            padding: 10px 4px;
            font-size: 16px;
            font-family: monospace;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            min-height: 24px;
        }
        .conn-row.wifi-cols { grid-template-columns: 1fr 80px 60px; }
        .conn-row.mesht-cols { grid-template-columns: 1fr 70px 62px 72px; }
        .conn-row span:not(:first-child) { text-align: right; }
        .conn-row .node-id {
            color: var(--text-primary);
        }
        .conn-row .dim {
            color: var(--text-secondary);
        }
        .conn-row .q-good { color: var(--color-connected); font-weight: bold; }
        .conn-row .q-fair { color: var(--color-warning); font-weight: bold; }
        .conn-row .q-poor { color: var(--color-disconnected); font-weight: bold; }
        .conn-row .q-lost {
            color: var(--text-secondary);
            opacity: 0.5;
        }
        .conn-row .q-unknown {
            color: var(--text-secondary);
            font-style: italic;
        }
        .conn-row.lost .node-id {
            color: var(--text-secondary);
            opacity: 0.6;
        }

        /* Meshtastic freshness colors */
        .conn-row .fresh { color: var(--color-connected); }
        .conn-row .stale { color: var(--color-warning); }
        .conn-row .old { color: var(--text-secondary); opacity: 0.5; }

        /* Meshtastic SNR colors */
        .conn-row .snr-good { color: var(--color-connected); }
        .conn-row .snr-fair { color: var(--color-warning); }
        .conn-row .snr-poor { color: var(--color-disconnected); }

        .mesh-meta {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 4px;
            margin-bottom: 8px;
            padding: 0 4px;
        }

        .empty-msg {
            color: var(--text-secondary);
            font-size: 14px;
            padding: 8px 4px;
        }

        /* ── Collapsible nav ── */
        .tools-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 12px 0 8px 0;
            margin-top: 12px;
            border-top: 1px solid var(--border-color);
            cursor: pointer;
            font-size: 14px;
            color: var(--text-secondary);
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }
        .tools-toggle:hover { color: var(--text-primary); }
        .tools-toggle .arrow {
            transition: transform 0.2s;
            font-size: 12px;
        }
        .tools-toggle.open .arrow {
            transform: rotate(90deg);
        }
        .tools-body {
            display: none;
            padding: 4px 0 8px 0;
        }
        .tools-body.open { display: block; }
        .tools-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 16px;
        }
        .pill {
            padding: 10px 16px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 13px;
            font-family: monospace;
            transition: all 0.2s;
            min-height: 44px;
            display: flex;
            align-items: center;
        }
        .pill:hover {
            background: rgba(26, 9, 241, 0.2);
            border-color: #1A09f1;
            color: var(--text-primary);
        }
        .btn-shutdown {
            padding: 10px 28px;
            background: var(--color-disconnected);
            border: none;
            border-radius: 20px;
            color: #fff;
            font-size: 13px;
            font-family: monospace;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            min-height: 44px;
        }
        .btn-shutdown:hover { opacity: 0.8; }
        .btn-shutdown:disabled { opacity: 0.4; cursor: not-allowed; }

        #last-update {
            text-align: center;
            color: var(--text-secondary);
            font-size: 11px;
            margin-top: 12px;
        }
        #last-update.no-data {
            color: var(--color-disconnected);
            font-weight: bold;
            font-size: 13px;
        }
    </style>
</head>
<body>
    <main>
        <div class="dash">

            <!-- Logo + IP -->
            <div class="top-bar">
                <img src="{{ url_for('static', filename='images/NatakMeshsecondary-overlay.png') }}" alt="Natak Mesh" class="logo">
                <div class="mesh-ip" id="mesh-ip">--</div>
            </div>

            <!-- Mesh status -->
            <div class="status-line">
                <span id="wlan1-status" class="st-down">Mesh: --</span>
            </div>

            <!-- WiFi Mesh Neighbors -->
            <div class="section-hdr" id="wifi-hdr">WiFi Mesh</div>
            <div class="col-hdr wifi-cols">
                <span>Node</span><span>Signal</span><span>Link</span>
            </div>
            <div id="nb-container">
                <div class="empty-msg">Loading...</div>
            </div>

            <!-- Meshtastic Nodes -->
            <div class="section-hdr">Meshtastic</div>
            <div class="col-hdr mesht-cols">
                <span>Node</span><span>SNR</span><span>Hops</span><span>Heard</span>
            </div>
            <div id="mesh-radio-container">
                <div class="empty-msg">Loading...</div>
            </div>

            <!-- Collapsible Tools & Settings -->
            <div class="tools-toggle" id="tools-toggle" onclick="toggleTools()">
                <span class="arrow">▶</span> Tools &amp; Settings
            </div>
            <div class="tools-body" id="tools-body">
                <div class="tools-grid">
                    <a href="/voice" class="pill">Voice PTT</a>
                    <a href="/monitor" class="pill">Monitor</a>
                    <a href="/config" class="pill">Config</a>

                    <a href="/scan" class="pill">Wi-Fi Scan</a>
                    <a href="/remote" class="pill">Remote</a>
                    <a href="/network" class="pill">Network</a>
                    <a href="/opendht" class="pill">OpenDHT</a>
                    <a href="/meshtastic" class="pill">Meshtastic</a>
                    <a href="/reticulum" class="pill">Reticulum</a>
                    <a href="/opentakserver" class="pill" id="pill-ots">OpenTAKServer</a>
                    <a href="/pathtrace" class="pill">Path Trace</a>
                    <a href="/update" class="pill">Update</a>
                </div>
            </div>

            <!-- Shutdown (always visible) -->
            <div style="text-align: center; margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--border-color);">
                <button class="btn-shutdown" id="btn-shutdown2" onclick="shutdownNode()">Shutdown Node</button>
            </div>

            <div id="last-update"></div>
        </div>
    </main>

    <script>
        const STALE_THRESHOLD = 15000; // ms without a successful refresh = stale
        let lastSuccess = 0;
        let lastSuccessTimeStr = null;

        function toggleTools() {
            const toggle = document.getElementById('tools-toggle');
            const body = document.getElementById('tools-body');
            toggle.classList.toggle('open');
            body.classList.toggle('open');
        }

        function formatAge(lastHeard) {
            if (!lastHeard) return '?';
            const secs = Math.floor(Date.now() / 1000) - lastHeard;
            if (secs < 0) return 'now';
            if (secs < 60) return secs + 's';
            if (secs < 3600) return Math.floor(secs / 60) + 'm';
            if (secs < 86400) return Math.floor(secs / 3600) + 'h';
            return Math.floor(secs / 86400) + 'd';
        }

        function freshnessClass(lastHeard) {
            if (!lastHeard) return 'old';
            const secs = Math.floor(Date.now() / 1000) - lastHeard;
            if (secs < 300) return 'fresh';   // < 5 min
            if (secs < 1800) return 'stale';  // < 30 min
            return 'old';
        }

        function snrClass(snr) {
            // LoRa SNR: > 5 dB solid, 0-5 dB okay, < 0 dB marginal
            if (snr > 5) return 'snr-good';
            if (snr >= 0) return 'snr-fair';
            return 'snr-poor';
        }

        // Babel cost → link %: cost is ETX-based, 256 = perfect delivery.
        // link % = 256 / cost * 100, capped at 100.
        function linkPct(cost) {
            const c = parseInt(cost, 10);
            if (!c || c <= 0) return null;
            return Math.min(100, Math.round((256 / c) * 100));
        }

        function renderNeighbors(neighbors) {
            const nb = document.getElementById('nb-container');
            if (!neighbors || neighbors.length === 0) {
                nb.innerHTML = '<div class="empty-msg">No mesh neighbors</div>';
                return;
            }
            let h = '';
            neighbors.forEach(function(n) {
                if (n.status === 'connected') {
                    const q = n.cost_quality || 'unknown';
                    const pct = linkPct(n.cost);
                    const pctTxt = (pct !== null) ? pct + '%' : '--';
                    const sig = (n.signal_avg !== null && n.signal_avg !== undefined)
                        ? n.signal_avg + '<span class="dim"> dBm</span>' : '--';
                    h += '<div class="conn-row wifi-cols">'
                       + '<span class="node-id">' + n.ip + '</span>'
                       + '<span class="dim">' + sig + '</span>'
                       + '<span class="q-' + q + '">' + pctTxt + '</span>'
                       + '</div>';
                } else {
                    h += '<div class="conn-row wifi-cols lost">'
                       + '<span class="node-id">' + n.ip + '</span>'
                       + '<span></span>'
                       + '<span class="q-lost">lost</span>'
                       + '</div>';
                }
            });
            nb.innerHTML = h;
        }

        function renderMeshtastic(m) {
            const mc = document.getElementById('mesh-radio-container');
            let mh = '';

            if (m.nodes && m.nodes.length > 0) {
                m.nodes.forEach(function(node) {
                    const cls = freshnessClass(node.last_heard);
                    const age = formatAge(node.last_heard);

                    // SNR (last received packet, last hop only)
                    let snrTxt = '--', snrCls = 'dim';
                    if (node.snr !== null && node.snr !== undefined) {
                        snrTxt = Number(node.snr).toFixed(1);
                        snrCls = snrClass(node.snr);
                    }

                    // Hops
                    let hopsTxt = '--';
                    if (node.hops_away !== null && node.hops_away !== undefined) {
                        hopsTxt = (node.hops_away === 0) ? 'direct' : node.hops_away + ' hop' + (node.hops_away > 1 ? 's' : '');
                    }

                    mh += '<div class="conn-row mesht-cols">'
                        + '<span class="node-id">' + node.short_name + '</span>'
                        + '<span class="' + snrCls + '">' + snrTxt + '</span>'
                        + '<span class="dim">' + hopsTxt + '</span>'
                        + '<span class="' + cls + '">' + age + '</span>'
                        + '</div>';
                });
            } else {
                mh += '<div class="empty-msg">No nodes heard</div>';
            }

            // Radio / bridge status line
            const radioTxt = m.radio_detected ? 'Radio ✓' : 'No radio';
            const bridgeTxt = m.bridge_enabled ? 'Bridge ON' : 'BLE mode';
            const radioClass = m.radio_detected ? 'st-up' : 'st-down';
            mh += '<div class="mesh-meta">'
                + '<span class="' + radioClass + '">' + radioTxt + '</span>'
                + ' · ' + bridgeTxt
                + '</div>';

            mc.innerHTML = mh;
        }

        function checkStale() {
            const el = document.getElementById('last-update');
            if (lastSuccess && (Date.now() - lastSuccess) > STALE_THRESHOLD) {
                el.className = 'no-data';
                el.textContent = 'NO DATA — last update ' + (lastSuccessTimeStr || 'unknown');
            }
        }

        async function refresh() {
            try {
                const r = await fetch('/api/dashboard');
                if (!r.ok) throw new Error('HTTP ' + r.status);
                const d = await r.json();

                lastSuccess = Date.now();

                // Mesh IP
                document.getElementById('mesh-ip').textContent = d.mesh_ip || 'N/A';

                // wlan1 status (channel detail lives on the Monitor page)
                const w = document.getElementById('wlan1-status');
                if (d.wlan1.active) {
                    w.textContent = 'Mesh Up';
                    w.className = 'st-up';
                } else {
                    w.textContent = 'Mesh Down';
                    w.className = 'st-down';
                }

                // WiFi section header with channel congestion
                const wifiHdr = document.getElementById('wifi-hdr');
                const cu = d.channel_utilization;
                if (cu) {
                    var congColor = cu.busy_pct < 30 ? 'var(--color-connected)' :
                                    cu.busy_pct < 50 ? '#66ff66' :
                                    cu.busy_pct < 70 ? 'var(--color-warning)' :
                                    'var(--color-disconnected)';
                    wifiHdr.innerHTML = 'WiFi Mesh <span style="float:right;font-size:14px;color:' + congColor + ';text-transform:none;letter-spacing:0">' + cu.busy_pct + '% congestion</span>';
                } else {
                    wifiHdr.textContent = 'WiFi Mesh';
                }

                renderNeighbors(d.neighbors);
                renderMeshtastic(d.meshtastic || {});

                // Show/hide OpenTAKServer pill based on OTS_ENABLED
                const otsPill = document.getElementById('pill-ots');
                if (otsPill) otsPill.style.display = d.ots_enabled ? '' : 'none';

                // Timestamp + version
                const t = new Date(d.timestamp);
                lastSuccessTimeStr = t.toLocaleTimeString();
                const ver = d.version ? d.version + ' · ' : '';
                const el = document.getElementById('last-update');
                el.className = '';
                el.textContent = ver + 'Updated ' + lastSuccessTimeStr;

            } catch (e) {
                console.error('Dashboard fetch error:', e);
                checkStale();
            }
        }

        async function shutdownNode() {
            if (!confirm('Shut down this node?\nYou will need to unplug and replug power to restart.')) return;
            var btn = document.getElementById('btn-shutdown2');
            btn.disabled = true;
            btn.textContent = 'Shutting down...';
            try {
                await fetch('/api/shutdown', { method: 'POST' });
            } catch (e) { /* expected — node is powering off */ }
        }

        refresh();
        setInterval(refresh, 5000);
        setInterval(checkStale, 5000);
        document.addEventListener('visibilitychange', function() { if (!document.hidden) refresh(); });
    </script>
</body>
</html>
