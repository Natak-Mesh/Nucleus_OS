# Nucleus Mesh Configuration
MESH_NAME="natak_mesh"
MESH_CHANNEL=3
MESH_PASSWORD="52235223"
# Format MESH_IP=10.20.1.xxx where xxx is node S/N
MESH_IP=10.20.1.9
# IPv6 link-local addresses for Babel neighbor discovery (must be unique per node)
MESH_IPV6_LL=fe80::a3c3:4e41:d850:bf66
# Format BR_LAN_IP=10.20.xxx.1 where xxx is node S/N
BR_LAN_IP=10.20.9.1
BR_LAN_IPV6_LL=fe80::5f18:46da:c245:2b0e
AP_NAME="0009-nucleus-ap"
AP_CHANNEL=36
AP_PASSWORD="52235223"

# eth0 LAN Gateway Configuration
# Used when eth0 has no DHCP (device/laptop connected directly)
ETH0_STATIC_IP=10.10.9.1
ETH0_DHCP_POOL_OFFSET=10
ETH0_DHCP_POOL_SIZE=100

# Multicast IP TTL for locally-originated ATAK traffic
# ATAK sends multicast with low TTL (often TTL=1). The kernel won't forward
# multicast unless TTL > threshold, so a mangle rule in mesh-start.sh bumps
# TTL to this value on br-lan ingress. TTL=8 survives 8 L3 boundary crossings
# (one at each node's wlan1↔br-lan bridge). 802.11s handles multi-hop at L2.
MESH_MCAST_TTL=8

# 802.11s Mesh Layer 2 TTL
# Controls how many hops multicast/broadcast frames travel at the 802.11s layer.
# The kernel default is 31 which is far too high. 802.11s handles multi-hop
# multicast forwarding natively with dedup (RMC in mac80211/rx.c), so this is
# the actual hop limit for ATAK CoT and discovery propagation across the mesh.
# mesh_ttl and mesh_element_ttl are both set to this value in mesh-start.sh.
MESH_802_TTL=8

# Collision Avoidance Tuning
# RTS/CTS threshold in bytes (0=disabled, 500=recommended for 3+ nodes)
# Protects frames above this size with a channel reservation handshake
MESH_RTS_THRESHOLD=500

# ============================================================
# MAVLink / ArduPilot Configuration
# ============================================================
# Serial device connecting the Pi to the flight controller UART.
# On a Pi Zero 2 W this requires enable_uart=1 and dtoverlay=disable-bt
# in /boot/firmware/config.txt (deploy.sh checks for this).
MAVLINK_SERIAL=/dev/ttyAMA0

# FC UART baud rate. Must match SERIAL3_BAUD on the flight controller.
# The Pi wires to the FC's TX2/RX2 through-holes (USART2), which ArduPilot
# exposes as SERIAL3. (SERIAL3_BAUD=921 in ArduPilot means 921600.)
MAVLINK_BAUD=921600

# UDP port mavlink-router listens on for GCS connections over the mesh.
# Ground station connects with: --master=udpout:<MESH_IP>:14550
MAVLINK_UDP_PORT=14550

# AFTER THIS FILE HAS BEEN FILLED OUT, RUN config_generation.sh in /opt/nucleus/bin TO WRITE TO SYSTEM AND ENABLE NUCLEUS
