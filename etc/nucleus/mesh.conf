# Nucleus Mesh Configuration
MESH_NAME="natak_mesh"
MESH_CHANNEL=3
MESH_PASSWORD="52235223"
# Format MESH_IP=10.20.1.xxx where xxx is node S/N
MESH_IP=10.20.1.22
# IPv6 link-local addresses for Babel neighbor discovery (must be unique per node)
MESH_IPV6_LL=fe80::4d86:f1c9:72b5:3ea8
# Format BR_LAN_IP=10.20.xxx.1 where xxx is node S/N
BR_LAN_IP=10.20.22.1
BR_LAN_IPV6_LL=fe80::92e0:6ab4:d518:7fc3
AP_NAME="0022-nucleus-ap"
AP_CHANNEL=48
AP_PASSWORD="52235223"

# eth0 LAN Gateway Configuration
# Used when eth0 has no DHCP (device/laptop connected directly)
ETH0_STATIC_IP=10.10.22.1
ETH0_DHCP_POOL_OFFSET=10
ETH0_DHCP_POOL_SIZE=100

# Multicast IP TTL for locally-originated ATAK traffic
# ATAK sends multicast with low TTL (often TTL=1). The kernel won't forward
# multicast unless TTL > threshold, so a mangle rule in mesh-start.sh bumps
# TTL to this value on br-lan ingress. TTL=8 survives 8 L3 boundary crossings
# (one at each node's wlan1↔br-lan bridge). 802.11s handles multi-hop at L2.
MESH_MCAST_TTL=8

# 802.11s Mesh Layer 2 TTL
# Controls how many hops multicast/broadcast frames travel at the 802.11s layer.
# The kernel default is 31 which is far too high. 802.11s handles multi-hop
# multicast forwarding natively with dedup (RMC in mac80211/rx.c), so this is
# the actual hop limit for ATAK CoT and discovery propagation across the mesh.
# mesh_ttl and mesh_element_ttl are both set to this value in mesh-start.sh.
MESH_802_TTL=8

# Babel RTT tuning removed to debloat — see docs/babeld/rtt_tuning.md for reference.

# Collision Avoidance Tuning
# RTS/CTS threshold in bytes (0=disabled, 500=recommended for 3+ nodes)
# Protects frames above this size with a channel reservation handshake
MESH_RTS_THRESHOLD=500

# AFTER THIS FILE HAS BEEN FILLED OUT, RUN config_generation.sh in /opt/nucleus/bin TO WRITE TO SYSTEM AND ENABLE NUCLEUS


# ============================================================
# MAVLink / ArduPilot Configuration
# ============================================================
# Master switch for all drone/MAVLink processing on this node.
# false: config_generation.sh removes /etc/mavlink-router/main.conf
# and disables mavlink-router.service, so no drone process runs.
# true: the config is generated and the service is enabled.
# This node is an active drone node.
DRONE_ENABLED=true

# Serial device connecting the Pi to the flight controller UART.
# /dev/ttyAMA0 is the PL011 UART on GPIO14/15. It does NOT exist until
# dtoverlay=disable-bt releases it from the Bluetooth controller - run
# /opt/nucleus/bin/drone-uart-setup.sh and reboot. Do not fall back to
# /dev/ttyS0; the mini-UART is not stable at 921600.
# See docs/drone/uart-setup.md.
MAVLINK_SERIAL=/dev/ttyAMA0

# FC UART baud rate. Must match SERIAL3_BAUD on the flight controller.
# The Pi wires to the FC's TX2/RX2 through-holes (USART2), which ArduPilot
# exposes as SERIAL3. (SERIAL3_BAUD=921 in ArduPilot means 921600.)
MAVLINK_BAUD=921600

# UDP port mavlink-router listens on for GCS connections over the mesh.
# Ground station connects with: --master=udpout:<MESH_IP>:14550
MAVLINK_UDP_PORT=14550

# Ground station IP. One address, shared by every drone->GCS stream to this
# node (MAVLink telemetry push, video). Set it to the GCS mesh IP.
# For MAVLink it is optional: the Server endpoint above waits for the GCS to
# transmit first, so leaving this empty still accepts inbound GCS connections
# on MAVLINK_UDP_PORT. Setting it adds a push endpoint that streams telemetry
# unprompted as soon as both nodes are up.
GCS_IP=

# ============================================================
# LiDAR Configuration
# ============================================================
# Master switch for the LiDAR to MAVLink bridge on this node.
# false: config_generation.sh disables lidar-bridge.service.
# true: the service is enabled and DISTANCE_SENSOR is injected into
# the MAVLink stream, where mavlink-router forwards it to the GCS.
# Requires DRONE_ENABLED=true - without mavlink-router there is nothing
# to inject into. Defaults to false; set true only on nodes with a LiDAR.
LIDAR_ENABLED=false

# Serial device for the LD06/LD19 LiDAR. It sits on a CP2102 USB-UART
# bridge, so it enumerates as /dev/ttyUSB0 rather than a GPIO UART and
# does not compete with the FC link on /dev/ttyAMA0.
LIDAR_SERIAL=/dev/ttyUSB0

# LD06/LD19 fixed frame rate. The sensor does not support other bauds.
LIDAR_BAUD=230400

# MAV_SENSOR_ROTATION for the DISTANCE_SENSOR messages.
# 25 = MAV_SENSOR_ROTATION_PITCH_270 (pointing straight down).
# Use 0 for forward-facing.
LIDAR_ORIENTATION=25

# ============================================================
# GPS / GNSS Configuration
# ============================================================
# Master switch for the GNSS status monitor on this node.
# false: config_generation.sh disables gps-monitor.service.
# true: gps-monitor.service reads NMEA from GPS_SERIAL and keeps the
# current fix in /run/nucleus/gps.json (tmpfs, overwritten in place,
# never appended - no log growth, no SD wear). Look at it with
# gps-status.py. Does not require DRONE_ENABLED; it is independent of
# the FC link and injects nothing into MAVLink (that comes later).
GPS_ENABLED=false

# Serial device for the GNSS receiver. On the SIM7600G-H LTE modem the
# GNSS engine is exposed by ModemManager as the "gps" port, ttyUSB1
# (see: mmcli -m 0). ModemManager does not hold this port open, so the
# monitor can read it directly without disturbing the LTE connection.
GPS_SERIAL=/dev/ttyUSB1

# NMEA output baud for the GNSS port. 115200 is the SIM7600 default.
GPS_BAUD=115200

# ============================================================
# Camera Configuration
# ============================================================
# Master switch for the camera preflight check on this node.
# false: config_generation.sh skips the camera check entirely.
# true: config_generation.sh checks that /boot/firmware/config.txt is
# set up for the sensor on THIS board and warns (never edits) if not.
# It does not start any video service - see docs/drone/drone-hardware.md
# for the streaming command. Requires DRONE_ENABLED=true.
CAMERA_ENABLED=true

# Camera sensor model, used to build the expected dtoverlay line
# (e.g. imx708, imx219, imx477). Match the physical sensor.
CAMERA_SENSOR=imx708

# CSI port the camera is wired to. Only meaningful on a Compute Module,
# where the sensor must be declared explicitly (cam0 or cam1). Ignored
# on a regular Pi 4/5, which uses camera_auto_detect instead.
CAMERA_CSI_PORT=cam0

# ============================================================
# Video Streaming Configuration
# ============================================================
# Master switch for the video stream on this node.
# false: config_generation.sh disables nucleus-video.service.
# true: the service is enabled. rpicam-vid captures and hardware-encodes
# H.264, gstreamer wraps it in RTP and pushes it to GCS_IP:VIDEO_UDP_PORT.
# Requires DRONE_ENABLED=true and CAMERA_ENABLED=true, and GCS_IP must be
# set - the stream is a blind push to that address, it does not wait to be
# contacted like MAVLink does. Defaults to false; set true on camera nodes.
# QGC: Settings -> Video -> source "UDP h.264", port = VIDEO_UDP_PORT.
VIDEO_ENABLED=false

# UDP port the RTP H.264 stream is pushed to on the GCS. 5600 is the
# QGroundControl default for its "UDP h.264" source.
VIDEO_UDP_PORT=5600

# Capture resolution and frame rate. Defaults are conservative for a loaded
# or multi-hop 802.11s mesh; a single-hop bench link can go to 1280x720.
VIDEO_WIDTH=640
VIDEO_HEIGHT=480
VIDEO_FPS=30

# H.264 target bitrate in bits/sec. 750000 (750 kbps) keeps video airtime
# low enough not to starve MAVLink control on a shared mesh.
VIDEO_BITRATE=750000

