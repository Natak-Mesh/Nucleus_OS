#           Mesh Networking Radio           #
#############################################



# Nucleus Mesh Configuration
MESH_NAME="natak_mesh"
MESH_CHANNEL=3
MESH_PASSWORD="52235223"
# Format MESH_IP=10.20.1.xxx where xxx is node S/N
MESH_IP=10.20.1.9
# IPv6 link-local addresses for Babel neighbor discovery (must be unique per node)
MESH_IPV6_LL=fe80::a3c3:4e41:d850:bf66
# Format BR_LAN_IP=10.20.xxx.1 where xxx is node S/N
BR_LAN_IP=10.20.9.1
BR_LAN_IPV6_LL=fe80::5f18:46da:c245:2b0e
AP_NAME="0009-nucleus-ap"
AP_CHANNEL=36
AP_PASSWORD="52235223"

# eth0 LAN Gateway Configuration
# Used when eth0 has no DHCP (device/laptop connected directly)
ETH0_STATIC_IP=10.10.9.1
ETH0_DHCP_POOL_OFFSET=10
ETH0_DHCP_POOL_SIZE=100

# OpenDHT Configuration (Jami Support)
OPENDHT_ENABLED=true
OPENDHT_NETWORK_ID=12345
# IMPORTANT: Update the IPs below to match YOUR actual mesh node IPs
# Example: If you have nodes at 10.20.1.2 and 10.20.1.3, use: OPENDHT_BOOTSTRAP_IPS="10.20.1.2,10.20.1.3"
# List at least 2-3 other node IPs (your own IP will be automatically excluded)
OPENDHT_BOOTSTRAP_IPS="10.20.1.8,10.20.1.10"

# Multicast IP TTL for locally-originated ATAK traffic
# ATAK sends multicast with low TTL (often TTL=1). The kernel won't forward
# multicast unless TTL > threshold, so a mangle rule in mesh-start.sh bumps
# TTL to this value on br-lan ingress. TTL=8 survives 8 L3 boundary crossings
# (one at each node's wlan1↔br-lan bridge). 802.11s handles multi-hop at L2.
MESH_MCAST_TTL=8

# 802.11s Mesh Layer 2 TTL
# Controls how many hops multicast/broadcast frames travel at the 802.11s layer.
# The kernel default is 31 which is far too high. 802.11s handles multi-hop
# multicast forwarding natively with dedup (RMC in mac80211/rx.c), so this is
# the actual hop limit for ATAK CoT and discovery propagation across the mesh.
# mesh_ttl and mesh_element_ttl are both set to this value in mesh-start.sh.
MESH_802_TTL=8

# Babel RTT tuning removed to debloat — see docs/babeld/rtt_tuning.md for reference.

# Collision Avoidance Tuning
# RTS/CTS threshold in bytes (0=disabled, 500=recommended for 3+ nodes)
# Protects frames above this size with a channel reservation handshake
MESH_RTS_THRESHOLD=500

# USB Hub Power Cycle — Meshtastic radio lockup workaround
# Power-cycles all USB devices on hub 1-1 at boot to recover a crashed
# RAK4631 Meshtastic radio (nRF52840 firmware lockup during Pi USB init).
# Also triggers dynamic phy detection and smcroute restart since the
# power cycle changes device enumeration and timing.
# Only enable on nodes that experience Meshtastic radio lockups on boot.
# Requires: uhubctl (sudo apt install uhubctl)
# See: docs/meshtastic/meshtastic_radio_locking_up.md
USB_HUB_POWER_CYCLE=false

# ATAK CoT Bridge Configuration
# Bridges ATAK multicast CoT to/from Meshtastic LoRa
# When true (default), cot-bridge.service runs and the radio is in bridge mode
# When false, the radio is left in BLE mode for phone app
COT_BRIDGE_ENABLED=true

# OpenTAKServer — show OTS button in web UI
# Set to false on nodes that don't have OTS installed
OTS_ENABLED=true

# OpenVLM Voice — mesh PTT voice (openvlm-voice.service)
# Real-time PTT voice over the wlan1 mesh. Two front-ends feed the same
# transport: a tactical headset on the OpenVLM USB card (hardware PTT), and/or
# a phone on the node's Wi-Fi AP using the /voice web page (soft PTT, the
# phone's own mic/speaker are the handset). They interoperate transparently.
#
# Channel N maps to multicast group 239.10.10.N on wlan1 (valid 1-254).
# All nodes must be on the same channel to hear each other. Channel can be
# switched at runtime via the control socket (UDP 127.0.0.1:5556), the
# `voice channel N` CLI, or the web page channel picker:
#   echo -n "CHANNEL 2" | nc -u -w1 127.0.0.1 5556
VOICE_CHANNEL=1
# Named channel list shown in the web page / CLI picker. Format is a
# comma-separated list of number:label pairs (number 1-254). VOICE_CHANNEL
# above selects which of these is active at startup.
VOICE_CHANNELS="1:Channel 1,2:Channel 2,3:Channel 3"

# Per-source receive jitter buffer in ms. Higher = smoother on a congested
# mesh, lower = less voice delay. 80 is a good starting point.
VOICE_JITTER_MS=80
# Software mic gain applied before transmit (ComTac mics are low level).
VOICE_TX_GAIN=4

# LoRa Voice→Text — speech-to-text PTT over the Meshtastic radio
# Adds a second voice transport: while PTT is held, speech is transcribed
# on-device (Vosk STT); on release the TEXT is sent as ONE Meshtastic packet
# (~40 words / ~15-20 s of speech fits). The receiving node speaks it with
# Piper TTS and shows the text on the /voice page message log.
# Requires: python vosk + model at /opt/nucleus/models/vosk/,
# piper + voice at /opt/nucleus/models/piper/ (see install-packages.sh),
# COT_BRIDGE_ENABLED=true (the cot-bridge owns the radio and relays voice
# packets), and a Meshtastic preset fast enough for 230-byte packets
# (SHORT_FAST recommended). See docs/VoIP/lora_voice/lora_voice_text.md
VOICE_LORA_ENABLED=true
# Max seconds of speech per PTT press; the transcript is finalized and sent
# automatically if you hold longer than this.
VOICE_LORA_MAX_SECS=30
# Meshtastic app port for voice packets (PRIVATE_APP range 256-511; must not
# collide with the CoT bridge's 257). Same value on all nodes.
VOICE_LORA_PORTNUM=260
# LoRa hop limit for voice packets. 0 = direct RF neighbors only (recommended
# to keep airtime down); raise only if voice must relay through routers.
VOICE_LORA_HOP_LIMIT=0
# STT engine. vosk (default) is the fielded configuration. sherpa
# (sherpa-onnx streaming Zipformer 20M) was field-tested on Pi 4 2026-07-07
# and REJECTED: transcripts chopped at both ends + worse recognition than
# vosk-small (see docs/VoIP/lora_voice/lora_voice_text.md). The engine
# stays available for trialing other sherpa models on faster hardware
# only. Falls back to vosk automatically if the package/model is missing.
# options: vosk | sherpa (rejected on Pi 4)
VOICE_STT_ENGINE=vosk
# STT model override. Empty = the engine's default model (vosk:
# vosk-model-small-en-us-0.15, ~100 MB RAM, faster than real-time on a Pi 4
# so the transcript is ready the moment PTT is released; sherpa: the
# streaming zipformer 20M). Larger vosk models (e.g.
# vosk-model-en-us-0.22-lgraph) were tested and REJECTED on Pi 4: 10+ s of
# post-release latency and ~500-700 MB RAM. Only set this on faster
# hardware; value is a directory name under the engine's model dir or an
# absolute path.
VOICE_STT_MODEL=
# STT mic cleanup (default true): conditions the recognizer's audio with a
# 100 Hz high-pass (rumble/handling noise) plus WebRTC noise suppression if
# the webrtc-noise-gain pip package is installed. Streaming per-frame
# filters — zero added latency. Applies ONLY to the STT tap; the live IP
# voice path is untouched. Set false if it ever hurts recognition.
VOICE_STT_CLEANUP=true
# Optional grammar-constrained recognition (vosk engine only): path to a
# phrase-list file (one lowercase word/phrase per line). Constrains STT to a
# fixed radio vocabulary — much more accurate on listed phrases (callsigns,
# prowords, digits), but out-of-vocabulary speech is dropped rather than
# transcribed. Empty = free-form recognition.
# See /opt/nucleus/models/vosk/grammar.example.txt
VOICE_STT_GRAMMAR=

# LoRa Voice Streaming — live Codec2 voice over the Meshtastic radio
# A third voice transport: while PTT is held, mic audio is encoded to
# Codec2 3200 bps and STREAMED over LoRa live — the remote node hears you
# while you are still talking (~0.5-1 s behind), like a real PTT radio.
# Contrast with the voice->text transport above, which sends one text
# packet at release. Codec2 voice needs ~35% airtime duty while keyed at
# SHORT_FAST (SF7); the radio preset MUST be SHORT_FAST-class on all nodes
# or audio will fall hopelessly behind. Requires: pycodec2 + numpy pip
# packages (install-packages.sh), COT_BRIDGE_ENABLED=true. Wire format is
# compatible with the VoiceOverLoRa (VLoRa) ATAK Vx bridges.
# See docs/VoIP/lora_voice/lora_voice_stream.md
VOICE_LORA_STREAM_ENABLED=true
# Meshtastic app port for the voice stream (PRIVATE_APP range 256-511; must
# differ from VOICE_LORA_PORTNUM and the CoT bridge's 257). 256 matches the
# VLoRa project's Vx bridges. Same value on all nodes.
VOICE_LORA_STREAM_PORTNUM=256

# meshtasticd — Radio connection mode (TCP via Docker vs USB serial)
# Controls how cot_bridge.py connects to the Meshtastic radio:
#   false (default) = USB serial (SerialInterface, /dev/ttyACM0)
#   true            = TCP via meshtasticd Docker (TCPInterface, localhost:4403)
#
# Set false for USB radios (RAK4631 etc.) which have their own firmware.
# Set true for Pi HAT radios (RAK6421 SPI/GPIO) where meshtasticd IS the firmware.
# The node name is derived from the hostname: long name = hostname (e.g. 0042-nucleus),
# short name = first 4 characters (e.g. 0042). A unique MAC address is generated
# automatically on first run and persisted in ~/meshtasticd/.mac_address.
# Requires (when true): Docker, meshtastic pip package (already installed).
MESHTASTICD_ENABLED=true
# LoRa hardware config name (without .yaml extension) from the image's available.d/.
# Common options: lora-RAK6421-13302-slot1 (1W PA), lora-RAK6421-13302-slot2,
#                 lora-RAK6421-13300-slot1 (standard), lora-RAK6421-13300-slot2
MESHTASTICD_LORA_CONFIG=lora-RAK6421-13302-slot2

# AFTER THIS FILE HAS BEEN FILLED OUT, RUN config_generation.sh in /opt/nucleus/bin TO WRITE TO SYSTEM AND ENABLE NUCLEUS
