[Unit]
# Gate the entire official TAK Server stack behind the mesh bring-up.
# takserver.service is the only enabled TAK unit; its init script starts all
# sub-services (config/messaging/api/plugins/retention) synchronously, so
# ordering this one unit gates the whole stack.
#
# Why: takserver (Java + PostgreSQL + Docker) is heavy and, without ordering,
# boots in parallel with mesh-start.service, starving the CPU during the
# timing-sensitive mesh/radio bring-up (fixed sleeps + meshtastic handshakes
# in mesh-start.sh) and leaving the mesh degraded. Waiting until mesh-start
# and cot-bridge have finished lets the mesh come up clean first.
#
# Safe on nodes WITHOUT takserver: with no takserver.service present this
# drop-in is simply never applied (inert, no errors, no boot cost).
After=mesh-start.service cot-bridge.service
Wants=mesh-start.service

[Service]
# mesh-start.service is a oneshot that exits before the mesh is fully
# converged (it backgrounds the cot-bridge restart and babeld route
# convergence continues after the script returns). Hold takserver off for a
# short settle window so its heavy Java/Postgres/Docker load lands on an
# already-stable mesh instead of one that is still coming up.
ExecStartPre=/bin/sleep 30
