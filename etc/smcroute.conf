# ATAK Voice - DISABLED 2025-12-23
# These routes caused severe mesh network degradation:
# - 646K dropped multicast packets on wlan1 TX queue
# - Mesh latency increased from <1ms to 6-8 seconds
# - Video streaming (MediaMTX) completely broken
# - All services (web, TAKServer) became unreachable
#
# ROOT CAUSE ANALYSIS:
# The issue was NOT the smcroute configuration itself, but the interaction
# between multicast echo routing and TTL settings:
#
# 1. CoT routes (which work) have echo: "mroute from wlan1 ... to wlan1 br-lan"
#    This allows multi-hop propagation across the mesh. CoT works because
#    ATAK sends it with TTL=1, so echo packets die immediately (no loop).
#
# 2. Voice routes (below) did NOT have echo initially - only "to br-lan"
#    This prevented multi-hop propagation but also prevented storms.
#
# 3. The iptables TTL mangle rule (see ATAK_voice_video_plugin_configuration.md)
#    sets TTL=64 for voice multicast to allow mesh routing:
#    iptables -t mangle -A PREROUTING -i br-lan -d 239.255.255.0/24 -j TTL --ttl-set 64
#
# 4. With TTL=64 + echo routing, packets can loop 32+ times between nodes
#    before dying, causing catastrophic channel saturation.
#
# POTENTIAL FIX (UNTESTED):
# To enable voice across multi-hop mesh without storms:
# 1. Add echo routing (to wlan1 br-lan) like CoT has
# 2. Reduce TTL mangle from 64 to 4-8 hops max:
#    iptables -t mangle -A PREROUTING -i br-lan -d 239.255.255.0/24 -j TTL --ttl-set 4
#
# With TTL=4:
# - Voice can propagate 2-3 hops (reasonable for small mesh)
# - Echo loops die after 2 round trips instead of 32
# - Should prevent channel saturation
#
# CORRECTED ROUTES (with echo, requires TTL=4-8 mangle):
# mgroup from wlan1 group 239.255.255.1
# mgroup from br-lan group 239.255.255.1
# mroute from wlan1 group 239.255.255.1 to wlan1 br-lan
# mroute from br-lan group 239.255.255.1 to wlan1
#
