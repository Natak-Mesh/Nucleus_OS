# ATAK CoT data
# Multi-hop propagation is handled natively by 802.11s at Layer 2:
#   - mesh_fwding=1 enables frame forwarding between mesh points
#   - mesh_ttl (set via MESH_802_TTL in mesh.conf) controls hop limit
#   - RMC (Recent Multicast Cache) in mac80211/rx.c deduplicates by
#     (source address, mesh sequence number) — same principle as Meshtastic
#
# smcroute's job is ONLY to bridge between wlan1 (mesh) and br-lan (local LAN).
# The "to wlan1" echo that was previously on the wlan1-ingress routes has been
# removed. It caused exponential multicast amplification at 3+ nodes because
# each echo created a new IP packet with a new mesh sequence number, bypassing
# 802.11s dedup. See: docs/congestion_collision_tuning/mcast_storm_correction.md
#
# TO RE-ENABLE ECHO (if 802.11s native forwarding doesn't work for some reason):
#   Change "to br-lan" back to "to wlan1 br-lan" on the wlan1-ingress mroutes.
#   You MUST also reduce MESH_MCAST_TTL in mesh.conf to 3-4 to limit the storm.
mgroup from wlan1 group 239.2.3.1
mgroup from br-lan group 239.2.3.1
mroute from wlan1 group 239.2.3.1 to br-lan
mroute from br-lan group 239.2.3.1 to wlan1

# ATAK Discovery
mgroup from wlan1 group 224.10.10.1
mgroup from br-lan group 224.10.10.1
mroute from wlan1 group 224.10.10.1 to br-lan
mroute from br-lan group 224.10.10.1 to wlan1

# ATAK Voice - DISABLED 2025-12-23
# These routes caused severe mesh network degradation:
# - 646K dropped multicast packets on wlan1 TX queue
# - Mesh latency increased from <1ms to 6-8 seconds
# - Video streaming (MediaMTX) completely broken
# - All services (web, TAKServer) became unreachable
#
# ROOT CAUSE: The echo routing ("to wlan1 br-lan") combined with TTL=64
# created catastrophic multicast amplification — packets looped 32+ times
# between nodes before TTL expired. This is the same fundamental problem
# that was fixed above for CoT/Discovery by removing the echo.
#
# TO RE-ENABLE VOICE MULTICAST:
# Uncomment the routes below. With echo removed (using "to br-lan" only),
# multi-hop is handled by 802.11s natively. No TTL mangle rule needed.
# If echo must be re-added for some reason, keep MESH_MCAST_TTL <= 4.
#
# mgroup from wlan1 group 239.255.255.1
# mgroup from br-lan group 239.255.255.1
# mroute from wlan1 group 239.255.255.1 to br-lan
# mroute from br-lan group 239.255.255.1 to wlan1
#
# # ATAK Voice - contact discovery
# mgroup from wlan1 group 239.255.255.2
# mgroup from br-lan group 239.255.255.2
# mroute from wlan1 group 239.255.255.2 to br-lan
# mroute from br-lan group 239.255.255.2 to wlan1
